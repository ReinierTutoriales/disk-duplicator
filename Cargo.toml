[package]
name = "disk-duplicator"
version = "1.2.0"
edition = "2021"
description = "Copiador de archivos 1 origen → N destinos"
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
blake3 = "1.5"
walkdir = "2"
rfd = "0.15"

[build-dependencies]
embed-resource = "2.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
