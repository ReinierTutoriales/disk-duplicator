[package]
name = "disk-duplicator"
version = "0.3.1"
edition = "2021"
description = "Duplicador de discos físicos 1→N para Windows"
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
crc32fast = "1.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_Security",
]}

[build-dependencies]
embed-resource = "2.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
