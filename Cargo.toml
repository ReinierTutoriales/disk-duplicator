[package]
name = "disk-duplicator"
version = "1.4.1"
edition = "2021"
description = "RepartoCopier · copiador de archivos 1 origen → N destinos"
license = "MIT"

[[bin]]
name = "RepartoCopier"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
blake3 = "1.5"
walkdir = "2"
rfd = "0.15"
crossbeam-channel = "0.5"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "2.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
