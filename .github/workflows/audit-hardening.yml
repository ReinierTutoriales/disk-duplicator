fn runtime_is_reparse_point(meta: &fs::Metadata) -> bool {
    use std::os::windows::fs::MetadataExt;
    const FILE_ATTRIBUTE_REPARSE_POINT: u32 = 0x0000_0400;
    meta.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0
}

#[cfg(not(windows))]
fn runtime_is_reparse_point(_meta: &fs::Metadata) -> bool {
    false
}

fn validate_runtime_root(dest: &Path) -> Result<(), String> {
    let meta = fs::symlink_metadata(dest)
        .map_err(|e| format!("No se pudo inspeccionar destino {}: {e}", dest.display()))?;
    if !meta.is_dir() || meta.file_type().is_symlink() || runtime_is_reparse_point(&meta) {
        return Err(format!(
            "El destino cambió durante la copia o ahora es un enlace/junction/reparse point: {}.",
            dest.display()
        ));
    }
    Ok(())
}

fn ensure_runtime_directory(dest: &Path, rel: &Path) -> Result<(), String> {
    validate_runtime_root(dest)?;
    let mut current = dest.to_path_buf();
    for component in rel.components() {
        let Component::Normal(name) = component else {
            return Err(format!("Ruta relativa no segura: {}", rel.display()));
        };
        current.push(name);
        match fs::symlink_metadata(&current) {
            Ok(meta) => {
                if !meta.is_dir()
                    || meta.file_type().is_symlink()
                    || runtime_is_reparse_point(&meta)
                {
                    return Err(format!(
                        "La ruta de destino cambió o contiene un enlace/junction/reparse point: {}.",
                        current.display()
                    ));
                }
            }
            Err(e) if e.kind() == std::io::ErrorKind::NotFound => {
                fs::create_dir(&current).map_err(|create_err| {
                    format!("No se pudo crear la carpeta {}: {create_err}", current.display())
                })?;
                let meta = fs::symlink_metadata(&current).map_err(|inspect_err| {
                    format!("No se pudo reinspeccionar {}: {inspect_err}", current.display())
                })?;
                if !meta.is_dir()
                    || meta.file_type().is_symlink()
                    || runtime_is_reparse_point(&meta)
                {
                    return Err(format!(
                        "La carpeta recién creada no es un directorio normal: {}.",
                        current.display()
                    ));
                }
            }
            Err(e) => {
                return Err(format!("No se pudo inspeccionar {}: {e}", current.display()))
            }
        }
    }
    Ok(())
}

fn validate_runtime_destination_target(dest: &Path, rel: &Path) -> Result<(), String> {
    validate_runtime_root(dest)?;
    let components: Vec<Component<'_>> = rel.components().collect();
    if components.is_empty() {
        return Err("Ruta relativa vacía en el FAN-OUT.".into());
    }

    let mut current = dest.to_path_buf();
    for (index, component) in components.into_iter().enumerate() {
        let Component::Normal(name) = component else {
            return Err(format!("Ruta relativa no segura: {}", rel.display()));
        };
        current.push(name);
        let is_last = index + 1 == rel.components().count();
        match fs::symlink_metadata(&current) {
            Ok(meta) => {
                if meta.file_type().is_symlink() || runtime_is_reparse_point(&meta) {
                    return Err(format!(
                        "La ruta de destino cambió y ahora contiene un enlace/junction/reparse point: {}.",
                        current.display()
                    ));
                }
                if is_last {
                    if !meta.is_file() {
                        return Err(format!(
                            "Conflicto de destino: {} dejó de ser un archivo normal.",
                            current.display()
                        ));
                    }
                } else if !meta.is_dir() {
                    return Err(format!(
                        "Conflicto de destino: {} dejó de ser una carpeta.",
                        current.display()
                    ));
                }
            }
            Err(e) if e.kind() == std::io::ErrorKind::NotFound => {
                if !is_last {
                    return Err(format!(
                        "La carpeta de destino desapareció durante la copia: {}.",
                        current.display()
                    ));
                }
            }
            Err(e) => {
                return Err(format!("No se pudo inspeccionar {}: {e}", current.display()))
            }
        }
    }
    Ok(())
}

fn create_directory_layout(dests: &[PathBuf], dirs: &[PathBuf]) -> Result<(), String> {
    for dest in dests {
        if !dest.exists() {
            fs::create_dir_all(dest).map_err(|e| format!("destino {}: {e}", dest.display()))?;
        }
        validate_runtime_root(dest)?;
        for rel in dirs {
            ensure_runtime_directory(dest, rel)?;
        }
    }
    Ok(())
}
