name: Parallel BLAKE3 audit

on:
  push:
    branches: [main]
    paths:
      - '.github/apply_parallel_blake3.py'
      - '.github/workflows/parallel-blake3-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parallel-blake3-audit
  cancel-in-progress: true

jobs:
  validate-benchmark-integrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply parallel BLAKE3 path
        run: python .github/apply_parallel_blake3.py
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Benchmark BLAKE3 hot path
        run: dotnet run --project .github/hash-stress/HashStress.csproj -c Release
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit validated BLAKE3 optimization
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core/Recovery.cs dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs
          if (git diff --cached --quiet) { throw 'No BLAKE3 optimization produced.' }
          git commit -m "perf: parallelize multi-megabyte BLAKE3 updates"
          git push origin HEAD:main
