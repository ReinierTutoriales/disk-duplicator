name: Responsive Fluent UI optimization
on:
  push:
    branches: [ main ]
    paths:
      - '.github/ui_optimize.py'
      - '.github/workflows/ui-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: responsive-fluent-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Apply responsive Fluent UI optimization
        run: python .github/ui_optimize.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests release
        run: cargo test --locked --release --verbose

      - name: Build release
        run: cargo build --locked --release --verbose

      - name: Commit verified UI optimization and clean helpers
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/ui_optimize.py
          Remove-Item .github/workflows/ui-optimize.yml
          git add src/app/part1.rs src/app/part3.rs src/app/part4.rs src/app/part5.rs .github/ui_optimize.py .github/workflows/ui-optimize.yml
          git commit -m "ui: optimize responsive Fluent source controls"
          git push origin HEAD:main
