name: Clean merged branches

# Manual maintenance: deletes every remote branch whose commits are already in main.
# Branches with unmerged work are listed and kept. main is never touched.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Delete branches already merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0
          kept=0
          while read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "main" ] || [ "$branch" = "HEAD" ] && continue
            if git merge-base --is-ancestor "$ref" refs/remotes/origin/main; then
              echo "Borrando rama fusionada: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Se conserva (tiene trabajo sin fusionar): $branch"
              kept=$((kept + 1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
          echo "Borradas: $deleted · Conservadas: $kept"
