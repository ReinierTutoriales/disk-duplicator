name: UI sanitation fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-sanitize-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Apply UI sanitation
        shell: pwsh
        run: |
          python .github/ui_sanitize.py
          $path = 'src/app/part1.rs'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $old = "fn contains_mojibake(text: &str) -> bool {"
          $new = "#[cfg(test)]`nfn contains_mojibake(text: &str) -> bool {"
          if (-not $text.Contains($old)) { throw 'contains_mojibake helper not found' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
      - name: Format
        run: cargo fmt --all
      - name: Diff check
        run: git diff --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests release
        run: cargo test --locked --release
      - name: Build release
        run: cargo build --locked --release
      - name: Commit verified sanitation and clean helpers
        shell: pwsh
        run: |
          Remove-Item .github/ui_sanitize.py -Force
          Remove-Item .github/workflows/ui-sanitize-audit.yml -Force
          Remove-Item .github/workflows/ui-sanitize-fix.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/part1.rs src/app/part4.rs src/app/part5.rs .github
          git commit -m "ui: harden unicode responsive layout and feedback"
          git push origin HEAD:main
          gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
