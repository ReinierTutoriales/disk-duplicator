name: One-time RepartoCopier 1.4.2 bump

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bump-1.4.2.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Update package version safely
        shell: python
        run: |
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          old = 'version = "1.4.1"'
          new = 'version = "1.4.2"'
          if text.count(old) != 1:
              raise SystemExit('Cargo.toml no contiene exactamente una versión 1.4.1')
          cargo.write_text(text.replace(old, new, 1), encoding='utf-8')

          lock = Path('Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          old = '[[package]]\nname = "disk-duplicator"\nversion = "1.4.1"'
          new = '[[package]]\nname = "disk-duplicator"\nversion = "1.4.2"'
          if text.count(old) != 1:
              raise SystemExit('Cargo.lock no contiene exactamente el package raíz 1.4.1')
          lock.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Verify only version metadata changed
        shell: bash
        run: |
          set -euo pipefail
          git diff -- Cargo.toml Cargo.lock
          test "$(git diff --name-only | sort)" = $'Cargo.lock\nCargo.toml'
      - name: Commit version 1.4.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release 1.4.2"
          git push origin HEAD:main
