name: Integrate .NET recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/integrate_dotnet_recovery.py'
      - '.github/workflows/integrate-dotnet-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-dotnet-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-integrate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply recovery integration
        run: python .github/integrate_dotnet_recovery.py
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit validated recovery and clean helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/integrate_dotnet_recovery.py
          Remove-Item .github/workflows/integrate-dotnet-recovery.yml
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core/PreflightSafety.cs dotnet/RepartoCopier.Core/Recovery.cs dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs .github/integrate_dotnet_recovery.py .github/workflows/integrate-dotnet-recovery.yml
          git commit -m "feat: make C# recovery compatible with Rust state"
          git push origin HEAD:main
