name: Fix control delivery record

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-control-delivery-record.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Fix record inheritance
        shell: pwsh
        run: |
          $path = 'dotnet/RepartoCopier.Core/CopyEngine.cs'
          $text = Get-Content $path -Raw
          $old = '    private sealed class ControlDelivery : FanoutMessage'
          $new = '    private sealed record ControlDelivery : FanoutMessage'
          if (-not $text.Contains($old)) { throw 'ControlDelivery class shape not found.' }
          $text = $text.Replace($old, $new)
          Set-Content $path $text -NoNewline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'fix: make control delivery a fanout record'
          git push origin main
