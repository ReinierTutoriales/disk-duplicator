name: Variable QD writer migration

on:
  push:
    paths:
      - '.github/workflows/variable-qd-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Apply exact CopyEngine migration
        shell: pwsh
        run: ./tools/patch-variable-qd.ps1
