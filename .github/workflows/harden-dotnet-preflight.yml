name: Harden .NET preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/harden_dotnet_preflight.py'
      - '.github/workflows/harden-dotnet-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-dotnet-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-integrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply hardened preflight
        run: python .github/harden_dotnet_preflight.py
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit validated preflight and clean helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/harden_dotnet_preflight.py
          Remove-Item .github/workflows/harden-dotnet-preflight.yml
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core/PreflightSafety.cs dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs .github/harden_dotnet_preflight.py .github/workflows/harden-dotnet-preflight.yml
          git commit -m "feat: harden C# preflight path and space safety"
          git push origin HEAD:main
