name: Final Extreme alignment

on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_extreme_alignment.py'
      - '.github/workflows/final-extreme-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-extreme-alignment-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply final engine and UI cut
        shell: pwsh
        run: python tools/finalize_extreme_alignment.py

      - name: Canonicalize compact UI contract
        shell: pwsh
        run: |
          @'
          using Microsoft.VisualStudio.TestTools.UnitTesting;

          namespace RepartoCopier.Core.Tests;

          [TestClass]
          public sealed class WinUiCompactProgressContractTests
          {
              [TestMethod]
              public void RunningViewUsesOnlyOverallJobProgress()
              {
                  var root = FindRepositoryRoot();
                  var xaml = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml"));
                  var code = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml.cs"));
                  Assert.IsTrue(xaml.Contains("OverallProgressBar", StringComparison.Ordinal));
                  Assert.IsFalse(xaml.Contains("ProgressList", StringComparison.Ordinal));
                  Assert.IsFalse(code.Contains("_progressRows", StringComparison.Ordinal));
              }

              [TestMethod]
              public void PreparationViewIsCompactAndDestinationsAreHorizontal()
              {
                  var root = FindRepositoryRoot();
                  var xaml = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml"));
                  var code = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml.cs"));
                  Assert.IsTrue(code.Contains("SizeInt32(800, 460)", StringComparison.Ordinal));
                  Assert.IsTrue(xaml.Contains("MaxWidth", StringComparison.Ordinal) && xaml.Contains("780", StringComparison.Ordinal));
                  Assert.IsTrue(xaml.Contains("DestinationList", StringComparison.Ordinal));
                  Assert.IsTrue(xaml.Contains("ItemsStackPanel Orientation", StringComparison.Ordinal));
                  Assert.IsTrue(xaml.Contains("HorizontalScrollMode", StringComparison.Ordinal));
                  Assert.IsTrue(xaml.Contains("Header=\"Opciones\"", StringComparison.Ordinal));
              }

              [TestMethod]
              public void WindowUsesWindows11MicaLayeringAndInactiveTitleState()
              {
                  var root = FindRepositoryRoot();
                  var xaml = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml"));
                  var code = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml.cs"));
                  Assert.IsTrue(xaml.Contains("LayerFillColorDefaultBrush", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("ExtendsContentIntoTitleBar = true", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("SetTitleBar(AppTitleBar)", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("SystemBackdrop = new MicaBackdrop()", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("Activated += MainWindow_Activated", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("WindowActivationState.Deactivated", StringComparison.Ordinal));
              }

              [TestMethod]
              public void VerifyShowsRealSourceEquivalentSpeedAndEta()
              {
                  var root = FindRepositoryRoot();
                  var code = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml.cs"));
                  var telemetry = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.Core", "CopyTelemetry.cs"));
                  Assert.IsTrue(code.Contains("diagnostics.VerifyLogical5sBytesPerSecond", StringComparison.Ordinal));
                  Assert.IsTrue(telemetry.Contains("VerifyLogical5sBytesPerSecond", StringComparison.Ordinal));
                  Assert.IsTrue(telemetry.Contains("_verifyLogicalRate", StringComparison.Ordinal));
              }

              [TestMethod]
              public void OverallProgressUsesLogicalJobBytesNotAggregateDestinationBytes()
              {
                  var root = FindRepositoryRoot();
                  var code = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.WinUI", "MainWindow.xaml.cs"));
                  Assert.IsTrue(code.Contains("snapshots.Select(item => item.Total).DefaultIfEmpty(0UL).Max()", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("active.Min(item => item.Written)", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("snapshots.Select(item => item.VerifyBytesTotal).DefaultIfEmpty(0UL).Max()", StringComparison.Ordinal));
                  Assert.IsTrue(code.Contains("verifyActive.Min(item => item.VerifiedBytes)", StringComparison.Ordinal));
              }

              private static string FindRepositoryRoot()
              {
                  var current = new DirectoryInfo(AppContext.BaseDirectory);
                  while (current is not null)
                  {
                      if (File.Exists(Path.Combine(current.FullName, "RepartoCopier.sln"))) return current.FullName;
                      current = current.Parent;
                  }
                  throw new AssertFailedException("No se encontró la raíz del repositorio.");
              }
          }
          '@ | Set-Content dotnet/RepartoCopier.Core.Tests/WinUiCompactProgressContractTests.cs -NoNewline

      - name: Architecture guards
        shell: pwsh
        run: |
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          $telemetry = Get-Content dotnet/RepartoCopier.Core/CopyTelemetry.cs -Raw
          $xaml = Get-Content dotnet/RepartoCopier.WinUI/MainWindow.xaml -Raw
          $ui = Get-Content dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs -Raw
          if ($engine -notmatch 'SharedFanoutPoolBytes = 256L \* 1024 \* 1024') { throw '256 MiB FAN-OUT pool missing.' }
          if ($engine -notmatch 'VerificationWorkspaceBytes = 8 \* 1024 \* 1024') { throw 'Fixed verify workspace missing.' }
          if ($engine -notmatch 'activeBufferPool\.Dispose\(\);[\s\S]*if \(options\.Verify') { throw 'Large COPY pool is not released before VERIFY.' }
          foreach ($token in @('VerificationPlan','VerificationBlock','VerificationPlans','VerificationCrc32C')) {
            if ($engine.Contains($token)) { throw "Retired verify history token remains: $token" }
          }
          foreach ($token in @('sealed class VerificationWorkspace','GC.AllocateUninitializedArray<byte>','SourceBufferLease.BorrowPinned','Task.WhenAll(reads)','RecordVerifyLogicalBytes(expectedBytes)')) {
            if (-not $engine.Contains($token)) { throw "Verify invariant missing: $token" }
          }
          if (-not $telemetry.Contains('VerifyLogical5sBytesPerSecond')) { throw 'Verify rolling speed telemetry missing.' }
          if (-not $xaml.Contains('<ItemsStackPanel Orientation="Horizontal" />')) { throw 'Destinations are not horizontal.' }
          if (-not $xaml.Contains('LayerFillColorDefaultBrush')) { throw 'Windows 11 Mica content layer missing.' }
          if (-not $ui.Contains('SizeInt32(800, 460)')) { throw 'Compact window footprint missing.' }
          if (-not $ui.Contains('Activated += MainWindow_Activated')) { throw 'Inactive title bar integration missing.' }
          git diff --check

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier

      - name: Commit final product cut and remove migration scaffolding
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/finalize_extreme_alignment.py .github/workflows/final-extreme-alignment.yml
          git clean -fd artifact
          git add -A
          git diff --cached --check
          git commit -m 'perf: finalize streaming verify and compact Windows 11 UI'
          git push origin HEAD:main
