name: Fix Fluent UI build
on:
  push:
    paths:
      - '.github/workflows/fix-ui-build.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - shell: pwsh
        run: |
          $path = 'dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('            if (!ReferenceEquals(_job, observed)) return;`r`n            RefreshProgress();', '            if (!ReferenceEquals(_job, observed))`r`n                return;`r`n            RefreshProgress();')
          # C# forbids return from finally: guard the body instead.
          $old = @'
        finally
        {
            if (!ReferenceEquals(_job, observed)) return;
            RefreshProgress();
'@
          $new = @'
        finally
        {
            if (ReferenceEquals(_job, observed))
            {
            RefreshProgress();
'@
          if (-not $text.Contains($old)) { throw 'finally guard point not found' }
          $text = $text.Replace($old, $new)
          $oldTail = @'
            if (!cancelled && failed == 0 && ShutdownCheck.IsChecked == true)
                await OfferShutdownAsync();
        }
    }
'@
          $newTail = @'
            if (!cancelled && failed == 0 && ShutdownCheck.IsChecked == true)
                await OfferShutdownAsync();
            }
        }
    }
'@
          if (-not $text.Contains($oldTail)) { throw 'finally tail point not found' }
          $text = $text.Replace($oldTail, $newTail)
          $text = $text.Replace('var speed = snapshots.Sum(item => item.RecentBytesPerSecond);', 'var speed = snapshots.Aggregate<DestinationSnapshot, double>(0d, (sum, item) => sum + item.RecentBytesPerSecond);')
          $text = $text.Replace('FilesMetricText.Text = $"{snapshots.Sum(item => item.FilesDone)}";', 'var filesDone = snapshots.Aggregate<DestinationSnapshot, ulong>(0, (sum, item) => sum + item.FilesDone);`r`n        FilesMetricText.Text = $"{filesDone}";')
          $text = $text.Replace('snapshots.Length', 'snapshots.Count')
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          Remove-Item '.github/workflows/fix-ui-build.yml'
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add $path '.github/workflows/fix-ui-build.yml'
          git commit -m 'fix: compile Fluent UI experience'
          git push origin HEAD:main
