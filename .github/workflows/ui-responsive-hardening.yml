name: Responsive UI hardening
on:
  push:
    branches: [ main ]
    paths:
      - '.github/ui_responsive_hardening.py'
      - '.github/workflows/ui-responsive-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-ui-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-primary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Apply responsive UI hardening
        run: python .github/ui_responsive_hardening.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests release
        run: cargo test --locked --release --verbose
      - name: Build release
        run: cargo build --locked --release --verbose

  validate-stable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Apply responsive UI hardening
        run: python .github/ui_responsive_hardening.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests release
        run: cargo test --locked --release --verbose

  integrate:
    needs: [validate-primary, validate-stable]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply verified responsive UI hardening
        run: python .github/ui_responsive_hardening.py
      - name: Commit verified UI hardening and clean helpers
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/ui_responsive_hardening.py
          Remove-Item .github/workflows/ui-responsive-hardening.yml
          git add src/app/part1.rs src/app/part3.rs src/app/part4.rs src/app/part5.rs .github/ui_responsive_hardening.py .github/workflows/ui-responsive-hardening.yml
          git diff --cached --check
          git commit -m "ui: harden responsive setup and action layout"
          git push origin HEAD:main
