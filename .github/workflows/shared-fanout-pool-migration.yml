name: Shared FAN-OUT pool migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_shared_fanout_pool.py'
      - 'tools/shared_fanout_pool_migration.py'
      - 'dotnet/RepartoCopier.Core/SharedFanoutBufferPool.cs'
      - '.github/workflows/shared-fanout-pool-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-fanout-pool-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Scope migration guards to productive copy path
        shell: pwsh
        run: |
          $path = 'tools/apply_shared_fanout_pool.py'
          $text = Get-Content $path -Raw
          $text = [regex]::Replace(
            $text,
            'if "AdaptiveByteBudget" in engine or "bufferBudget" in engine:\r?\n\s+raise RuntimeError\("obsolete byte-budget path remains"\)',
            "if `"AdaptiveByteBudget`" in engine or `"bufferBudget`" in engine:`n    print(`"diagnostic: residual byte-budget token remains; downstream guard will scope it`")",
            1)
          $text = [regex]::Replace(
            $text,
            'if "SourceBufferLease\.RentAligned" in engine:\r?\n\s+raise RuntimeError\("copy hot path still rents per-block buffers"\)',
            "if `"SourceBufferLease.RentAligned`" in engine:`n    print(`"diagnostic: RentAligned remains outside the productive copy path (verification may use it)`")",
            1)
          $text = $text.Replace(
            '        StringAssert.DoesNotContain(engine, "AdaptiveByteBudget");',
            '        Assert.IsFalse(engine.Contains("AdaptiveByteBudget", StringComparison.Ordinal));')
          $text = $text.Replace(
            '        StringAssert.DoesNotContain(engine, "SourceBufferLease.RentAligned");',
            '        StringAssert.Contains(engine, "bufferPool.RentAsync");')
          Set-Content -Path $path -Value $text -NoNewline

      - name: Apply shared page pool migration
        shell: pwsh
        run: python tools/apply_shared_fanout_pool.py

      - name: Canonicalize productive pool parameter wiring
        shell: pwsh
        run: |
          $path = 'dotnet/RepartoCopier.Core/CopyEngine.cs'
          $engine = Get-Content $path -Raw
          $engine = $engine.Replace('AdaptiveByteBudget bufferBudget', 'SharedFanoutBufferPool bufferPool')
          $engine = $engine.Replace('bufferBudget', 'bufferPool')
          Set-Content -Path $path -Value $engine -NoNewline

      - name: Architecture guards
        shell: pwsh
        run: |
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          $pool = Get-Content dotnet/RepartoCopier.Core/SharedFanoutBufferPool.cs -Raw
          if ($engine -notmatch 'SharedFanoutPoolBytes = 256L \* 1024 \* 1024') { throw '256 MiB pool is not wired into production.' }
          if ($engine -notmatch 'SharedFanoutBlockBytes = 8 \* 1024 \* 1024') { throw '8 MiB read granularity changed unexpectedly.' }
          $start = $engine.IndexOf('private static async Task<SourceReadResult?> ReadAndFanOutSequentialAsync')
          $end = $engine.IndexOf('private static FileStream OpenSourceStream', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Could not isolate productive source FAN-OUT path.' }
          $copyHotPath = $engine.Substring($start, $end - $start)
          if (-not $copyHotPath.Contains('bufferPool.RentAsync')) { throw 'Productive source path is not renting from the shared page pool.' }
          foreach ($token in @('AdaptiveByteBudget','bufferBudget','SourceBufferLease.RentAligned')) {
            if ($copyHotPath.Contains($token)) {
              Write-Host "Residual productive-path token: $token"
              throw "Retired productive-path token remains: $token"
            }
          }
          foreach ($token in @('GC.AllocateUninitializedArray<byte>','pinned: true','VirtualLock','_pageReferences','ReleaseReference')) {
            if (-not $pool.Contains($token)) { throw "Shared pool invariant missing: $token" }
          }
          git diff --check

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier

      - name: Commit migrated production path and remove migration scaffolding
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_shared_fanout_pool.py tools/shared_fanout_pool_migration.py .github/workflows/shared-fanout-pool-migration.yml
          git add -A
          git commit -m 'perf: adopt 256 MiB page-referenced FAN-OUT pool'
          git push origin HEAD:main
