name: Performance limits audit

on:
  push:
    paths:
      - '.github/workflows/performance-limits-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enumerate performance limit candidates
        shell: pwsh
        run: |
          $patterns = @(
            'Threshold',
            'Math\.Clamp',
            'Math\.Min',
            'Math\.Max',
            'Maximum',
            'Minimum',
            'CreateBounded',
            'SemaphoreSlim',
            'WriteThrough',
            'Retries',
            'Task\.Delay',
            'QueueDepth',
            'Capacity',
            'Limit'
          )
          Get-ChildItem dotnet/RepartoCopier.Core -Filter *.cs -File |
            Select-String -Pattern $patterns |
            Sort-Object Path, LineNumber |
            ForEach-Object { "{0}:{1}: {2}" -f $_.Path.Replace("$PWD\",''), $_.LineNumber, $_.Line.Trim() }

      - name: Assert known obsolete hard caps stay absent
        shell: pwsh
        run: |
          $forbidden = @(
            'SourcePrefetchThreshold',
            'ParallelFileThresholdBytes',
            'MinimumFileSize',
            'MaxOutstandingIo',
            'RecommendedQueueDepth',
            'AcquireIoPairAsync',
            'WriteQueueDepthTwoAsync',
            'ReserveBacklogAsync',
            'QueueWaitTime',
            'MaximumBufferBudget',
            'SourcePrefetchPhysicalCapacity',
            'SourceHashPipelineCapacity'
          )
          $files = Get-ChildItem dotnet -Recurse -Filter *.cs -File |
            Where-Object { $_.Name -ne 'PerformanceFreedomArchitectureTests.cs' -and $_.Name -ne 'UnificationContractTests.cs' }
          foreach ($symbol in $forbidden) {
            $hit = $files | Select-String -SimpleMatch $symbol
            if ($hit) {
              $hit | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
              throw "Forbidden performance cap remains: $symbol"
            }
          }
