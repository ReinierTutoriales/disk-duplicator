name: RepartoCopier v2.0.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2.yml'

permissions:
  contents: write

concurrency:
  group: repartocopier-v2-release
  cancel-in-progress: false

jobs:
  validate-package-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Assert release tag is new
        shell: pwsh
        run: |
          $existing = git ls-remote --tags origin refs/tags/v2.0.0
          if ($existing) { throw 'Tag v2.0.0 already exists.' }

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Publish portable WinUI x64
        shell: pwsh
        run: |
          dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
          dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o artifacts/RepartoCopier-v2.0.0-win-x64

      - name: Verify published executable and package
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts/RepartoCopier-v2.0.0-win-x64 -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Published RepartoCopier executable not found.' }
          Compress-Archive -Path artifacts/RepartoCopier-v2.0.0-win-x64/* -DestinationPath artifacts/RepartoCopier-v2.0.0-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash artifacts/RepartoCopier-v2.0.0-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256  RepartoCopier-v2.0.0-win-x64.zip  $hash" | Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Remove temporary release workflow and finalize main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v2.yml
          git commit -m "chore: finalize clean v2.0.0 release tree"
          git push origin HEAD:main

      - name: Tag v2.0.0
        shell: pwsh
        run: |
          git tag -a v2.0.0 -m "RepartoCopier v2.0.0"
          git push origin v2.0.0

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 `
            artifacts/RepartoCopier-v2.0.0-win-x64.zip `
            artifacts/SHA256SUMS.txt `
            --title "RepartoCopier v2.0.0" `
            --notes-file CHANGELOG.md `
            --verify-tag
