name: One-time direct verification optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-direct-verification.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply direct verification optimization
        shell: pwsh
        run: |
          $nl = [Environment]::NewLine
          function Replace-Once([string]$Text, [string]$Old, [string]$New, [string]$Label) {
            $count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
            if ($count -ne 1) { throw "Expected one match for $Label, found $count." }
            return $Text.Replace($Old, $New)
          }
          function Replace-Between([string]$Text, [string]$Start, [string]$End, [string]$Replacement, [string]$Label) {
            $startIndex = $Text.IndexOf($Start, [StringComparison]::Ordinal)
            if ($startIndex -lt 0) { throw "Start marker not found for $Label." }
            if ($Text.IndexOf($Start, $startIndex + $Start.Length, [StringComparison]::Ordinal) -ge 0) { throw "Start marker not unique for $Label." }
            $endIndex = $Text.IndexOf($End, $startIndex, [StringComparison]::Ordinal)
            if ($endIndex -lt 0) { throw "End marker not found for $Label." }
            return $Text.Substring(0, $startIndex) + $Replacement + $nl + $nl + $Text.Substring($endIndex)
          }

          $directPath = 'dotnet/RepartoCopier.Core/DirectIoSourceReader.cs'
          $direct = [System.IO.File]::ReadAllText($directPath)
          $eligibility = @'
    internal static bool IsEligible(StorageDeviceInfo device, int transferSize) =>
        IsEligibleCore(device, transferSize, solidStateOnly: true);

    internal static bool IsVerificationEligible(StorageDeviceInfo device, int transferSize) =>
        IsEligibleCore(device, transferSize, solidStateOnly: false);

    private static bool IsEligibleCore(StorageDeviceInfo device, int transferSize, bool solidStateOnly)
    {
        ArgumentNullException.ThrowIfNull(device);
        if (!OperatingSystem.IsWindows() || transferSize <= 0 || device.IsNetwork || !device.ProbeSucceeded)
            return false;
        if (StorageDeviceIdentity.ConfidenceFor(device) != DeviceIdentityConfidence.Exact)
            return false;
        if (solidStateOnly && device.MediaKind != StorageMediaKind.SolidState)
            return false;
        if (!device.HasKnownSectorAlignment)
            return false;

        var alignment = RequiredAlignment(device);
        return alignment is >= 512 and <= 64 * 1024 &&
               IsPowerOfTwo(alignment) &&
               transferSize % alignment == 0;
    }
'@
          $direct = Replace-Between $direct '    internal static bool IsEligible(StorageDeviceInfo device, int transferSize)' '    internal static int RequiredAlignment' $eligibility 'eligibility policy'

          $openBlock = @'
    internal static bool TryOpen(
        string path,
        StorageDeviceInfo device,
        int transferSize,
        out Session? session) =>
        TryOpenCore(path, device, transferSize, verification: false, out session);

    internal static bool TryOpenForVerification(
        string path,
        StorageDeviceInfo device,
        int transferSize,
        out Session? session) =>
        TryOpenCore(path, device, transferSize, verification: true, out session);

    private static bool TryOpenCore(
        string path,
        StorageDeviceInfo device,
        int transferSize,
        bool verification,
        out Session? session)
    {
        session = null;
        var eligible = verification
            ? IsVerificationEligible(device, transferSize)
            : IsEligible(device, transferSize);
        if (!eligible)
            return false;

        var handle = NativeMethods.CreateFileW(
            path,
            GenericRead,
            FileShare.Read,
            IntPtr.Zero,
            OpenExisting,
            FileFlagNoBuffering | FileFlagSequentialScan,
            IntPtr.Zero);
        if (handle.IsInvalid)
        {
            handle.Dispose();
            return false;
        }

        session = new Session(handle, RequiredAlignment(device));
        return true;
    }
'@
          $direct = Replace-Between $direct '    internal static bool TryOpen(' '    internal static bool IsFallbackable' $openBlock 'direct open policy'
          [System.IO.File]::WriteAllText($directPath, $direct, [System.Text.UTF8Encoding]::new($false))

          $enginePath = 'dotnet/RepartoCopier.Core/CopyEngine.cs'
          $engine = [System.IO.File]::ReadAllText($enginePath)
          $engine = Replace-Once $engine '    private const int LargeBufferSize = 4 * 1024 * 1024;' ('    private const int LargeBufferSize = 4 * 1024 * 1024;' + $nl + '    private const int VerificationReadBufferSize = 8 * 1024 * 1024;' + $nl + '    private const int VerificationDirectIoThreshold = 4 * 1024 * 1024;') 'verification constants'

          $oldVerifyCall = @'
                var actual = await HashFileAsync(
                    destination,
                    job.Token,
                    resources,
                    job.Telemetry,
                    verification: true,
                    verificationProgress: progress[slot]).ConfigureAwait(false);
'@
          $newVerifyCall = @'
                var actual = await HashFileAsync(
                    destination,
                    job.Token,
                    resources,
                    job.Telemetry,
                    verification: true,
                    verificationProgress: progress[slot],
                    directDevice: copy.DestinationDevices[slot],
                    directScheduler: workers[slot].DeviceScheduler).ConfigureAwait(false);
'@
          $engine = Replace-Once $engine $oldVerifyCall $newVerifyCall 'verification call'

          $hashMethod = @'
    private static async Task<byte[]> HashFileAsync(
        string path,
        CancellationToken token,
        ResourceGovernor? resources = null,
        CopyTelemetry? telemetry = null,
        bool verification = false,
        DestinationProgress? verificationProgress = null,
        StorageDeviceInfo? directDevice = null,
        DeviceScheduler? directScheduler = null)
    {
        using var hasher = Hasher.New();
        var bufferSize = verification ? VerificationReadBufferSize : 4 * 1024 * 1024;
        var fileLength = verification ? new FileInfo(path).Length : 0L;
        SourceBufferLease? buffer = null;
        DirectIoSourceReader.Session? direct = null;
        FileStream? buffered = null;
        long totalRead = 0;

        try
        {
            var directOpened = verification &&
                fileLength >= VerificationDirectIoThreshold &&
                directDevice is not null &&
                DirectIoSourceReader.TryOpenForVerification(path, directDevice, bufferSize, out direct);

            if (directOpened)
            {
                buffer = SourceBufferLease.RentAligned(bufferSize, direct!.Alignment);
            }
            else
            {
                buffer = SourceBufferLease.RentBuffered(bufferSize);
                buffered = OpenSourceStream(path);
            }

            while (true)
            {
                var readStarted = Stopwatch.GetTimestamp();
                int read;
                try
                {
                    if (directScheduler is null)
                    {
                        read = direct is not null
                            ? direct.Read(buffer, bufferSize)
                            : await buffered!.ReadAsync(buffer.Memory, token).ConfigureAwait(false);
                    }
                    else
                    {
                        using var ioLease = await directScheduler.AcquireIoAsync(token).ConfigureAwait(false);
                        read = direct is not null
                            ? direct.Read(buffer, bufferSize)
                            : await buffered!.ReadAsync(buffer.Memory, token).ConfigureAwait(false);
                    }
                }
                catch (Exception ex) when (direct is not null && DirectIoSourceReader.IsFallbackable(ex))
                {
                    direct.Dispose();
                    direct = null;
                    buffer.Dispose();
                    buffer = SourceBufferLease.RentBuffered(bufferSize);
                    buffered = OpenSourceStream(path);
                    buffered.Position = totalRead;

                    if (directScheduler is null)
                    {
                        read = await buffered.ReadAsync(buffer.Memory, token).ConfigureAwait(false);
                    }
                    else
                    {
                        using var ioLease = await directScheduler.AcquireIoAsync(token).ConfigureAwait(false);
                        read = await buffered.ReadAsync(buffer.Memory, token).ConfigureAwait(false);
                    }
                }

                var readElapsed = Stopwatch.GetElapsedTime(readStarted);
                if (verification)
                    telemetry?.RecordVerifyRead(read, readElapsed);
                if (read == 0)
                    break;

                totalRead += read;
                if (verification)
                    verificationProgress?.AddVerified(read);

                if (resources is null)
                {
                    var hashStarted = Stopwatch.GetTimestamp();
                    hasher.UpdateWithJoin(buffer.Memory.Span[..read]);
                    if (verification)
                        telemetry?.RecordVerifyHash(read, Stopwatch.GetElapsedTime(hashStarted));
                }
                else
                {
                    var cpuWaitStarted = Stopwatch.GetTimestamp();
                    using var lease = await resources.EnterCpuWorkAsync(token).ConfigureAwait(false);
                    if (verification)
                        telemetry?.RecordVerifyCpuWait(Stopwatch.GetElapsedTime(cpuWaitStarted));
                    var hashStarted = Stopwatch.GetTimestamp();
                    hasher.UpdateWithJoin(buffer.Memory.Span[..read]);
                    if (verification)
                        telemetry?.RecordVerifyHash(read, Stopwatch.GetElapsedTime(hashStarted));
                }
            }
            return hasher.Finalize().AsSpan().ToArray();
        }
        finally
        {
            direct?.Dispose();
            if (buffered is not null)
                await buffered.DisposeAsync().ConfigureAwait(false);
            buffer?.Dispose();
        }
    }
'@
          $engine = Replace-Between $engine '    private static async Task<byte[]> HashFileAsync(' '    private static void CommitPart(' $hashMethod 'verification hash method'
          [System.IO.File]::WriteAllText($enginePath, $engine, [System.Text.UTF8Encoding]::new($false))

          $testPath = 'dotnet/RepartoCopier.Core.Tests/DirectIoSourceReaderTests.cs'
          $tests = [System.IO.File]::ReadAllText($testPath)
          $anchor = @'
    [TestMethod]
    public void BufferedLeaseKeepsExistingArrayPoolContract()
'@
          $newTest = @'
    [TestMethod]
    public void VerificationEligibilityAllowsExactLocalHddButRejectsUnsafeTopology()
    {
        var hdd = Device("SATA", StorageMediaKind.Rotational, 512, 4096);
        var network = Device("Network", StorageMediaKind.Rotational, 512, 4096) with
        {
            IsNetwork = true,
            PhysicalDeviceNumber = null,
        };
        var unknownIdentity = Device("USB", StorageMediaKind.Rotational, 512, 4096) with
        {
            PhysicalDeviceNumber = null,
        };

        Assert.IsTrue(DirectIoSourceReader.IsVerificationEligible(hdd, 8 * 1024 * 1024));
        Assert.IsFalse(DirectIoSourceReader.IsVerificationEligible(network, 8 * 1024 * 1024));
        Assert.IsFalse(DirectIoSourceReader.IsVerificationEligible(unknownIdentity, 8 * 1024 * 1024));
        Assert.IsFalse(DirectIoSourceReader.IsVerificationEligible(hdd, 8 * 1024 * 1024 - 1));
    }

    [TestMethod]
    public void BufferedLeaseKeepsExistingArrayPoolContract()
'@
          $tests = Replace-Once $tests $anchor $newTest 'verification eligibility test'
          [System.IO.File]::WriteAllText($testPath, $tests, [System.Text.UTF8Encoding]::new($false))

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Build WinUI Release x64
        shell: pwsh
        run: |
          dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
          dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit optimized verification
        shell: pwsh
        run: |
          git config user.name "ReinierTutoriales"
          git config user.email "86568548+ReinierTutoriales@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/DirectIoSourceReader.cs dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core.Tests/DirectIoSourceReaderTests.cs
          if (git diff --cached --quiet) { throw 'No code changes were produced.' }
          git commit -m "perf(core): accelerate verification with direct aligned reads"
          git push origin HEAD:main
