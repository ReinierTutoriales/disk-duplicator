name: Adaptive QD CopyEngine migration

on:
  push:
    paths:
      - '.github/workflows/adaptive-qd-copyengine-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Integrate adaptive QD in CopyEngine
        shell: pwsh
        run: ./tools/patch-adaptive-qd-copyengine.ps1
