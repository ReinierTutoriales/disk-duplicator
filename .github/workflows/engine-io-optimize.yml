name: Optimize copy I/O

on:
  push:
    branches: [main]
    paths:
      - '.github/optimize_engine_io.py'
      - '.github/workflows/engine-io-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-io-optimize
  cancel-in-progress: true

jobs:
  validate-and-integrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply I/O optimization
        run: python .github/optimize_engine_io.py
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit validated I/O optimization
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/CopyEngine.cs
          if (git diff --cached --quiet) { throw 'No I/O changes produced.' }
          git commit -m "perf: streamline Windows async I/O pipeline"
          git push origin HEAD:main
