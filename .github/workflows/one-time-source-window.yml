name: One-time source window patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-source-window.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Apply exact CopyEngine tuning replacements
        shell: pwsh
        run: |
          $path = 'dotnet/RepartoCopier.Core/CopyEngine.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $replacements = [ordered]@{
            'private const int BlockSize = 16 * 1024 * 1024;' = 'private const int BlockSize = 32 * 1024 * 1024;'
            'private const int SourcePrefetchPhysicalCapacity = 4;' = 'private const int SourcePrefetchPhysicalCapacity = 8;'
            'private const int SourceHashPipelineCapacity = 2;' = 'private const int SourceHashPipelineCapacity = 4;'
            'private const int InitialPrefetch = 2;' = 'private const int InitialPrefetch = 4;'
            '// 4 GiB / 16 MiB = 256 maximum live data blocks. At the public' = '// 4 GiB / 32 MiB = 128 maximum live data blocks. At the public'
          }
          foreach ($old in $replacements.Keys) {
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "Expected exactly one match for [$old], found $count." }
            $text = $text.Replace($old, $replacements[$old])
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $path) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }
          git diff --check
          git diff -- $path

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit exact tuning patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core/CopyEngine.cs
          git commit -m 'perf(core): raise active source window to 32 MiB and 4-8 prefetch'
          git push origin HEAD:main
