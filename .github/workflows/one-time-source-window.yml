name: One-time source window patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-source-window.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Apply exact source-window and test replacements
        shell: pwsh
        run: |
          $nl = [Environment]::NewLine
          $enginePath = 'dotnet/RepartoCopier.Core/CopyEngine.cs'
          $engine = [System.IO.File]::ReadAllText($enginePath)
          $engineReplacements = [ordered]@{
            'private const int BlockSize = 16 * 1024 * 1024;' = 'private const int BlockSize = 32 * 1024 * 1024;'
            'private const int SourcePrefetchPhysicalCapacity = 4;' = 'private const int SourcePrefetchPhysicalCapacity = 8;'
            'private const int SourceHashPipelineCapacity = 2;' = 'private const int SourceHashPipelineCapacity = 4;'
            'private const int InitialPrefetch = 2;' = 'private const int InitialPrefetch = 4;'
            '// 4 GiB / 16 MiB = 256 maximum live data blocks. At the public' = '// 4 GiB / 32 MiB = 128 maximum live data blocks. At the public'
          }
          foreach ($old in $engineReplacements.Keys) {
            $count = ([regex]::Matches($engine, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "Expected exactly one engine match for [$old], found $count." }
            $engine = $engine.Replace($old, $engineReplacements[$old])
          }
          [System.IO.File]::WriteAllText($enginePath, $engine, [System.Text.UTF8Encoding]::new($false))

          $corePath = 'dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs'
          $core = [System.IO.File]::ReadAllText($corePath)
          $acquire = '        await governor.AcquirePrefetchSlotAsync(CancellationToken.None);'
          $twoAcquires = $acquire + $nl + $acquire
          $fourAcquires = $acquire + $nl + $acquire + $nl + $acquire + $nl + $acquire
          $acquireCount = ([regex]::Matches($core, [regex]::Escape($twoAcquires))).Count
          if ($acquireCount -ne 2) { throw "Expected 2 two-slot setup blocks, found $acquireCount." }
          $core = $core.Replace($twoAcquires, $fourAcquires)

          $assertOld = 'Assert.AreEqual(2, governor.InFlight);'
          if (([regex]::Matches($core, [regex]::Escape($assertOld))).Count -ne 1) { throw 'Expected one in-flight=2 assertion.' }
          $core = $core.Replace($assertOld, 'Assert.AreEqual(4, governor.InFlight);')

          $release = '        governor.ReleasePrefetchSlot();'
          $assertZero = '        Assert.AreEqual(0, governor.InFlight);'
          $twoReleases = $release + $nl + $release + $nl + $assertZero
          $fourReleases = $release + $nl + $release + $nl + $release + $nl + $release + $nl + $assertZero
          $releaseCount = ([regex]::Matches($core, [regex]::Escape($twoReleases))).Count
          if ($releaseCount -ne 2) { throw "Expected 2 two-release teardown blocks, found $releaseCount." }
          $core = $core.Replace($twoReleases, $fourReleases)
          [System.IO.File]::WriteAllText($corePath, $core, [System.Text.UTF8Encoding]::new($false))

          $fastPath = 'dotnet/RepartoCopier.Core.Tests/ProductionFastPathTests.cs'
          $fast = [System.IO.File]::ReadAllText($fastPath)
          $old1 = '        // 20 MiB + 733 bytes uses two source blocks (16 MiB + tail). With two'
          $old2 = '        // destinations the optimized writer must issue exactly four WriteAsync calls.'
          $old3 = '        Assert.AreEqual(4L, metrics.WriteOperations);'
          foreach ($old in @($old1,$old2,$old3)) {
            if (([regex]::Matches($fast, [regex]::Escape($old))).Count -ne 1) { throw "Expected one fast-path match for [$old]." }
          }
          $fast = $fast.Replace($old1, '        // 20 MiB + 733 bytes now fits in one 32 MiB source block. With two')
          $fast = $fast.Replace($old2, '        // destinations the writer must issue exactly two block writes on QD1 storage.')
          $fast = $fast.Replace($old3, '        Assert.AreEqual(2L, metrics.WriteOperations);')
          [System.IO.File]::WriteAllText($fastPath, $fast, [System.Text.UTF8Encoding]::new($false))

          $expected = @($enginePath, $corePath, $fastPath) | Sort-Object
          $changed = @(git diff --name-only | Sort-Object)
          if (($changed -join '|') -ne ($expected -join '|')) { throw "Unexpected changed files: $($changed -join ', ')" }
          git diff --check
          git diff -- $enginePath $corePath $fastPath

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit exact tuning patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs dotnet/RepartoCopier.Core.Tests/ProductionFastPathTests.cs
          git commit -m 'perf(core): raise active source window to 32 MiB and 4-8 prefetch'
          git push origin HEAD:main
