name: Remove control backlog

on:
  push:
    paths:
      - '.github/workflows/remove-control-backlog.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Remove fixed control-message backlog gate
        shell: pwsh
        run: ./tools/patch-remove-control-backlog.ps1
