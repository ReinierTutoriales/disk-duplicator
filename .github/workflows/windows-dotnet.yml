name: Windows .NET CI

# Permanent gate for the integrated FAN-OUT engine and Windows application.
# Validates the 256 MiB page-referenced shared pool/backpressure model,
# fixed-workspace streaming verification, overlapped Direct I/O source/verify paths,
# Direct I/O destination writes with buffered fallback, recovery, and the WinUI product.
on:
  pull_request:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'tools/simulate_fanout.py'
      - 'tools/test_simulate_fanout.py'
      - 'tools/bench-diskspd.ps1'
      - 'docs/SOURCE-BENCHMARK.md'
      - 'docs/FANOUT-PERFORMANCE-ROADMAP.md'
      - 'RepartoCopier.sln'
      - 'global.json'
      - '.github/workflows/windows-dotnet.yml'
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'tools/simulate_fanout.py'
      - 'tools/test_simulate_fanout.py'
      - 'tools/bench-diskspd.ps1'
      - 'docs/SOURCE-BENCHMARK.md'
      - 'docs/FANOUT-PERFORMANCE-ROADMAP.md'
      - 'RepartoCopier.sln'
      - 'global.json'
      - '.github/workflows/windows-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test logical FAN-OUT simulator
        run: python -m unittest discover -s tools -p test_simulate_fanout.py

      - name: Parse DiskSpd measurement script without running storage I/O
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'tools/bench-diskspd.ps1'),
            [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Assert C#/.NET-only product sources
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Error "Legacy source remains: $_" }
            throw 'Repository must remain C#/.NET-only.'
          }

      - name: Verify embedded build revision
        shell: pwsh
        run: |
          $assemblies = @(Get-ChildItem 'dotnet/RepartoCopier.WinUI/bin/Release' -Recurse -Filter 'RepartoCopier.WinUI.dll')
          if ($assemblies.Count -eq 0) { throw 'Built WinUI assembly not found.' }
          foreach ($assembly in $assemblies) {
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($assembly.FullName).ProductVersion
            if (-not $version.EndsWith('+${{ github.sha }}', [StringComparison]::OrdinalIgnoreCase)) {
              throw "Incorrect embedded build revision: $version"
            }
          }

      - name: Publish portable self-contained build
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier -p:SourceRevisionId=${{ github.sha }}

      - name: Smoke-test standalone executable startup and close
        shell: pwsh
        run: |
          $smokeDirectory = Join-Path $env:RUNNER_TEMP "RepartoCopier-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $smokeDirectory -Force | Out-Null
          $smokeExe = Join-Path $smokeDirectory 'RepartoCopier.WinUI.exe'
          Copy-Item 'artifact/RepartoCopier/*' $smokeDirectory -Recurse
          $appProcess = $null
          try {
            $appProcess = Start-Process -FilePath $smokeExe -WorkingDirectory $smokeDirectory -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $ready = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              $appProcess.Refresh()
              if ($appProcess.HasExited) { throw "Standalone app exited during startup: $($appProcess.ExitCode)" }
              if ($appProcess.MainWindowHandle -ne [IntPtr]::Zero) { $ready = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Standalone app did not create its window.' }
            if (-not $appProcess.CloseMainWindow()) { throw 'Standalone app did not accept a normal close request.' }
            if (-not $appProcess.WaitForExit(10000)) { throw 'Standalone app did not finish normal close.' }
            if ($appProcess.ExitCode -ne 0) { throw "Standalone app failed on close: $($appProcess.ExitCode)" }
            if (Test-Path (Join-Path $env:TEMP '.net/RepartoCopier.WinUI')) { throw 'The portable build must not self-extract into %TEMP%.' }
          }
          finally {
            if ($null -ne $appProcess -and -not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force }
            Remove-Item $smokeDirectory -Recurse -Force
          }

      - name: Check rendered layouts and native dialogs
        shell: pwsh
        run: |
          $layoutReport = Join-Path $env:RUNNER_TEMP 'RepartoCopier-layout-check.json'
          $layoutExe = Join-Path $env:GITHUB_WORKSPACE 'artifact/RepartoCopier/RepartoCopier.WinUI.exe'
          $layoutProcess = Start-Process -FilePath $layoutExe -ArgumentList @('--layout-check', $layoutReport) -PassThru
          try {
            if (-not $layoutProcess.WaitForExit(90000)) { throw 'Layout check did not complete.' }
            if (Test-Path $layoutReport) { Get-Content $layoutReport }
            if ($layoutProcess.ExitCode -ne 0) { throw "Layout check failed: $($layoutProcess.ExitCode)" }
            if (-not (Test-Path $layoutReport)) { throw 'Layout check report missing.' }
            $layoutResult = Get-Content $layoutReport -Raw | ConvertFrom-Json
            if (-not $layoutResult.Passed) { throw 'Rendered layout check did not pass.' }
          }
          finally {
            if (-not $layoutProcess.HasExited) { Stop-Process -Id $layoutProcess.Id -Force }
          }

      - name: Exercise read-only source benchmark
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:RUNNER_TEMP "source-bench-$env:GITHUB_RUN_ID.bin"
          $reportFile = Join-Path $env:RUNNER_TEMP "source-bench-$env:GITHUB_RUN_ID.json"
          $benchExe = Join-Path $env:GITHUB_WORKSPACE 'artifact/RepartoCopier/RepartoCopier.WinUI.exe'
          $stream = [System.IO.FileStream]::new($sourceFile, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write)
          try {
            $buffer = [byte[]]::new(1024 * 1024)
            $rng = [System.Random]::new(12345)
            for ($index = 0; $index -lt 32; $index++) {
              $rng.NextBytes($buffer)
              $stream.Write($buffer)
            }
          } finally { $stream.Dispose() }
          $benchProcess = Start-Process -FilePath $benchExe -ArgumentList @('--source-bench', $sourceFile, $reportFile, '--readers', '1,2', '--seconds', '1') -PassThru
          try {
            if (-not $benchProcess.WaitForExit(90000)) { throw 'Source benchmark timed out.' }
            if ($benchProcess.ExitCode -ne 0) { throw "Source benchmark failed: $($benchProcess.ExitCode)" }
            if (-not (Test-Path $reportFile)) { throw 'Source benchmark report missing.' }
            $report = Get-Content $reportFile -Raw | ConvertFrom-Json
            if ($report.BuildRevision -ne '${{ github.sha }}') { throw 'Wrong source benchmark build revision.' }
            if ($report.Runs.Count -ne 2 -or $report.Runs[1].Measurements.Count -ne 2) {
              throw 'Source benchmark did not exercise one and two readers.'
            }
            if ($report.Runs[1].Measurements[0].LastHash -ne $report.Runs[1].Measurements[1].LastHash) {
              throw 'Source readers observed different hashes.'
            }
          } finally {
            if (-not $benchProcess.HasExited) { Stop-Process -Id $benchProcess.Id -Force }
            Remove-Item $sourceFile -Force -ErrorAction SilentlyContinue
          }

      - name: Upload source benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RepartoCopier-source-bench-report
          path: ${{ runner.temp }}/source-bench-${{ github.run_id }}.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload rendered layout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RepartoCopier-layout-report
          path: ${{ runner.temp }}/RepartoCopier-layout-check.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload downloadable test build
        uses: actions/upload-artifact@v7
        with:
          name: RepartoCopier-main-win-x64
          path: artifact/RepartoCopier/
          if-no-files-found: error
          retention-days: 14
