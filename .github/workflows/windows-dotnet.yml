name: Windows .NET CI

# Permanent gate for the integrated FAN-OUT engine and Windows application.
# Validates the 256 MiB page-referenced shared pool/backpressure model,
# fixed-workspace streaming verification, overlapped Direct I/O source/verify paths,
# Direct I/O destination writes with buffered fallback, recovery, and the WinUI product.
on:
  pull_request:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'tools/simulate_fanout.py'
      - 'tools/test_simulate_fanout.py'
      - 'docs/FANOUT-PERFORMANCE-ROADMAP.md'
      - 'RepartoCopier.sln'
      - '.github/workflows/windows-dotnet.yml'
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'tools/simulate_fanout.py'
      - 'tools/test_simulate_fanout.py'
      - 'docs/FANOUT-PERFORMANCE-ROADMAP.md'
      - 'RepartoCopier.sln'
      - '.github/workflows/windows-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test logical FAN-OUT simulator
        run: python -m unittest discover -s tools -p test_simulate_fanout.py

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Assert C#/.NET-only product sources
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Error "Legacy source remains: $_" }
            throw 'Repository must remain C#/.NET-only.'
          }

      - name: Verify embedded build revision
        shell: pwsh
        run: |
          $assemblies = @(Get-ChildItem 'dotnet/RepartoCopier.WinUI/bin/Release' -Recurse -Filter 'RepartoCopier.WinUI.dll')
          if ($assemblies.Count -eq 0) { throw 'Built WinUI assembly not found.' }
          foreach ($assembly in $assemblies) {
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($assembly.FullName).ProductVersion
            if (-not $version.EndsWith('+${{ github.sha }}', [StringComparison]::OrdinalIgnoreCase)) {
              throw "Incorrect embedded build revision: $version"
            }
          }

      - name: Publish portable self-contained build
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier -p:SourceRevisionId=${{ github.sha }}

      - name: Smoke-test standalone executable startup and close
        shell: pwsh
        run: |
          $smokeDirectory = Join-Path $env:RUNNER_TEMP "RepartoCopier-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $smokeDirectory -Force | Out-Null
          $smokeExe = Join-Path $smokeDirectory 'RepartoCopier.WinUI.exe'
          Copy-Item 'artifact/RepartoCopier/RepartoCopier.WinUI.exe' $smokeExe
          $appProcess = $null
          try {
            $appProcess = Start-Process -FilePath $smokeExe -WorkingDirectory $smokeDirectory -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $ready = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              $appProcess.Refresh()
              if ($appProcess.HasExited) { throw "Standalone app exited during startup: $($appProcess.ExitCode)" }
              if ($appProcess.MainWindowHandle -ne [IntPtr]::Zero) { $ready = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Standalone app did not create its window.' }
            if (-not $appProcess.CloseMainWindow()) { throw 'Standalone app did not accept a normal close request.' }
            if (-not $appProcess.WaitForExit(10000)) { throw 'Standalone app did not finish normal close.' }
            if ($appProcess.ExitCode -ne 0) { throw "Standalone app failed on close: $($appProcess.ExitCode)" }
          }
          finally {
            if ($null -ne $appProcess -and -not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force }
            Remove-Item $smokeDirectory -Recurse -Force
          }

      - name: Upload downloadable test build
        uses: actions/upload-artifact@v6
        with:
          name: RepartoCopier-main-win-x64
          path: artifact/RepartoCopier/RepartoCopier.WinUI.exe
          if-no-files-found: error
          retention-days: 14
