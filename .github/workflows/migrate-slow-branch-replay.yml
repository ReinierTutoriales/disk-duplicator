name: Migrate slow branch replay

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-slow-branch-replay.ps1'
      - '.github/workflows/migrate-slow-branch-replay.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Rebase on latest main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: Apply slow branch replay
        shell: pwsh
        run: ./tools/patch-slow-branch-replay.ps1
      - name: Normalize generated output
        shell: pwsh
        run: |
          $literal = [string][char]96 + 'r' + [char]96 + 'n'
          $newline = "`r`n"
          $paths = @(
            'docs/FANOUT-PERFORMANCE-ROADMAP.md',
            'dotnet/RepartoCopier.Core.Tests/UnificationContractTests.cs',
            'dotnet/RepartoCopier.Core.Tests/BranchReplayStoreTests.cs',
            'dotnet/RepartoCopier.Core/BranchReplayStore.cs',
            'dotnet/RepartoCopier.Core/CopyEngine.cs',
            'dotnet/RepartoCopier.Core/CopyTelemetry.cs'
          )
          foreach ($path in $paths) {
            $content = Get-Content -LiteralPath $path -Raw
            if ($path.EndsWith('CopyEngine.cs') -or $path.EndsWith('CopyTelemetry.cs')) {
              $content = $content.Replace($literal, $newline)
            }
            $content = [regex]::Replace($content, '(\r?\n)+\z', '') + $newline
            [System.IO.File]::WriteAllText((Resolve-Path $path), $content, [System.Text.UTF8Encoding]::new($false))
          }
          git diff --check
      - name: Core tests
        shell: pwsh
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release
      - name: WinUI release build
        shell: pwsh
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -p:Platform=x64
      - name: Commit migration and cleanup
        shell: pwsh
        run: |
          git rm tools/patch-slow-branch-replay.ps1 .github/workflows/migrate-slow-branch-replay.yml
          git add dotnet docs
          git status --short
          git commit -m "perf: decouple lagging destination branches with replay"
          git pull --rebase origin main
          git push origin main
