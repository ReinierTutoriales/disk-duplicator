name: Apply QD2 large writes

on:
  push:
    paths:
      - '.github/workflows/apply-q2-large-writes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Patch CopyEngine QD2 path
        shell: pwsh
        run: |
          $encoded = ''
          [System.IO.File]::WriteAllBytes('patch_qd2.py', [Convert]::FromBase64String($encoded))
          python patch_qd2.py
          Remove-Item patch_qd2.py
          Remove-Item '.github/workflows/apply-q2-large-writes.yml'
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core/CopyEngine.cs '.github/workflows/apply-q2-large-writes.yml'
          git commit -m 'perf: add QD2 RandomAccess large-file writes'
          git push origin HEAD:main
