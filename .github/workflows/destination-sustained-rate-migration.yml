name: Destination sustained-rate migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-destination-sustained-rate.ps1'
      - '.github/workflows/destination-sustained-rate-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply per-destination sustained-rate migration
        shell: pwsh
        run: ./tools/patch-destination-sustained-rate.ps1
      - name: Test sliding-rate contracts first
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --filter "FullyQualifiedName~SlidingByteRateWindowTests|FullyQualifiedName~SustainedDestinationRateArchitectureTests"
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit product change and remove migration infrastructure
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/SlidingByteRateWindow.cs dotnet/RepartoCopier.Core/CopyTelemetry.cs dotnet/RepartoCopier.Core/Models.cs dotnet/RepartoCopier.Core.Tests/SlidingByteRateWindowTests.cs dotnet/RepartoCopier.Core.Tests/SustainedDestinationRateArchitectureTests.cs
          git rm tools/patch-destination-sustained-rate.ps1 .github/workflows/destination-sustained-rate-migration.yml
          git commit -m "perf: expose sustained write rate per destination"
          git pull --rebase origin main
          git push origin HEAD:main
