name: Release v2.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      TARGET_SHA: 565c2de3cb42db176337702d8cb9629756195145
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 565c2de3cb42db176337702d8cb9629756195145
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Assert release source is clean and versioned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Release checkout is not the pinned clean commit.' }
          if (Test-Path '.github/workflows/release-v2.1.0.yml') { throw 'Pinned release source must not contain the temporary release workflow.' }
          $patches = @(git ls-files 'tools/patch-*.ps1')
          if ($patches.Count -gt 0) { throw 'Temporary migration scripts remain in release source.' }
          $workflows = @(git ls-files '.github/workflows/*.yml')
          if ($workflows.Count -ne 1 -or $workflows[0] -ne '.github/workflows/windows-dotnet.yml') { throw "Release source must contain only permanent CI. Found: $($workflows -join ', ')" }
          $core = Get-Content 'dotnet/RepartoCopier.Core/RepartoCopier.Core.csproj' -Raw
          $ui = Get-Content 'dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj' -Raw
          foreach ($text in @($core, $ui)) {
            if ($text -notmatch '<Version>2\.1\.0</Version>') { throw 'Version 2.1.0 missing.' }
            if ($text -notmatch '<AssemblyVersion>2\.1\.0\.0</AssemblyVersion>') { throw 'AssemblyVersion 2.1.0.0 missing.' }
            if ($text -notmatch '<FileVersion>2\.1\.0\.0</FileVersion>') { throw 'FileVersion 2.1.0.0 missing.' }
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch '## v2\.1\.0 — 2026-09-15') { throw 'v2.1.0 changelog section missing.' }
          git diff --check

      - name: Restore Core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test Core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Assert product architecture contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
          if ($forbidden.Count -gt 0) { throw 'Release source must remain C#/.NET-only.' }
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          if ($engine -notmatch 'TransientIoErrorClassifier\.IsTransient') { throw 'Transient retry classifier lost productive consumer.' }
          if ($engine -notmatch 'BranchReplayPlacement\.ResolveSafeDirectory') { throw 'Safe replay placement lost productive consumer.' }
          if ($engine -notmatch 'ReplayGate\.ShouldReplay') { throw 'Replay hysteresis lost productive consumer.' }
          $ui = Get-Content dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs -Raw
          if ($ui -notmatch 'SpeedMetricText\.Text = paused \? "0\.0 B/s"') { throw 'Paused throughput contract missing.' }

      - name: Validate AppLogo PNG
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $path = [string](Resolve-Path 'dotnet/RepartoCopier.WinUI/Assets/AppLogo.png')
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $signature = [byte[]](137,80,78,71,13,10,26,10)
          for ($i=0; $i -lt 8; $i++) { if ($bytes[$i] -ne $signature[$i]) { throw 'Invalid AppLogo PNG signature.' } }
          $tail = [System.Text.Encoding]::ASCII.GetString($bytes, $bytes.Length - 12, 12)
          if ($tail -notmatch 'IEND') { throw 'AppLogo PNG is truncated.' }
          $bmp = [System.Drawing.Bitmap]::FromFile($path)
          try {
            if ($bmp.Width -ne 256 -or $bmp.Height -ne 256) { throw 'AppLogo PNG dimensions must be 256x256.' }
            foreach ($p in @(@(0,0), @(255,0), @(0,255), @(255,255))) {
              if ($bmp.GetPixel($p[0],$p[1]).A -ne 0) { throw 'AppLogo corners must be transparent.' }
            }
          } finally { $bmp.Dispose() }

      - name: Publish self-contained win-x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier

      - name: Validate published executable version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'artifact/RepartoCopier/RepartoCopier.WinUI.exe'
          if ($exe.VersionInfo.FileVersion -notlike '2.1.0.*') { throw "Unexpected published FileVersion: $($exe.VersionInfo.FileVersion)" }
          if ($exe.Length -le 0) { throw 'Published executable is empty.' }

      - name: Package release and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path 'artifact/RepartoCopier/*' -DestinationPath 'dist/RepartoCopier-v2.1.0-win-x64.zip' -CompressionLevel Optimal
          $hash = (Get-FileHash 'dist/RepartoCopier-v2.1.0-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RepartoCopier-v2.1.0-win-x64.zip" | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          if ((Get-Item 'dist/RepartoCopier-v2.1.0-win-x64.zip').Length -le 0) { throw 'Release ZIP is empty.' }
          Write-Host "Release SHA256: $hash"

      - name: Prepare release notes
        shell: pwsh
        run: |
          @'
          ## RepartoCopier v2.1.0

          Esta versión consolida la arquitectura FAN-OUT productiva posterior a v2.0.0 y endurece rendimiento, recuperación e integridad sin reintroducir rutas legacy.

          ### Principales cambios
          - FAN-OUT unificado con `SharedBlock`, transferencia adaptativa y QD adaptativo por dispositivo.
          - Direct I/O overlapped para source, destinos y verify cuando la topología lo permite, con fallback buffered seguro.
          - Replay de ramas lentas solo cuando la ubicación física es demostrablemente segura, con histéresis sostenida.
          - Reintentos buffered limitados a errores realmente transitorios.
          - Verificación CRC32C/Castagnoli y telemetría de cuello de botella de verify.
          - Recovery endurecido ante crashes de journal/manifest, `.part` huérfanos, cleanup post-commit y concurrencia entre procesos.
          - Aislamiento de fallos por destino FAN-OUT y cancelación correcta desde pausa.
          - Throughput visual en pausa fijado inmediatamente a `0.0 B/s`.
          - Eliminación de rutas/clases reemplazadas (`StorageWritePolicy`, `FanoutPerformancePolicy`, `ExplicitOffsetWriter`).
          - `AppLogo.png` reparado y regenerado con transparencia válida.

          ### Validación
          - Suite Core Release completa.
          - WinUI Release x64 con warnings tratados como errores.
          - Contratos de arquitectura sobre retries, replay e UI pausada.
          - Publicación self-contained win-x64.
          - `SHA256SUMS.txt` incluido para verificar el ZIP descargable.

          **Plataforma:** Windows 10 2004 (19041) o posterior, x64 · .NET 10 · WinUI 3.
          '@ | Set-Content -Encoding utf8 release-notes.md

      - name: Publish GitHub release v2.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v2.1.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v2.1.0 already exists; refusing to overwrite.' }
          gh release create v2.1.0 `
            'dist/RepartoCopier-v2.1.0-win-x64.zip' `
            'dist/SHA256SUMS.txt' `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:TARGET_SHA" `
            --title 'RepartoCopier v2.1.0' `
            --notes-file 'release-notes.md' `
            --latest

      - name: Verify published release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view v2.1.0 --repo "$env:GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($release.tagName -ne 'v2.1.0') { throw 'Published tag mismatch.' }
          if ($release.isDraft -or $release.isPrerelease) { throw 'v2.1.0 must be a stable release.' }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names -notcontains 'RepartoCopier-v2.1.0-win-x64.zip') { throw 'Release ZIP missing.' }
          if ($names -notcontains 'SHA256SUMS.txt') { throw 'SHA256SUMS.txt missing.' }
