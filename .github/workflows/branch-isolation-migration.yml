name: Branch isolation migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/branch_isolation_migration.py'
      - 'tools/branch_isolation_test_fix.py'
      - '.github/workflows/branch-isolation-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply branch isolation migration
        shell: pwsh
        run: |
          python tools/branch_isolation_migration.py
          python tools/branch_isolation_test_fix.py
      - name: Assert superseded paths are gone
        shell: pwsh
        run: |
          if (Test-Path 'dotnet/RepartoCopier.Core/BranchReplayGate.cs') { throw 'BranchReplayGate.cs must be deleted' }
          $engine = Get-Content 'dotnet/RepartoCopier.Core/CopyEngine.cs' -Raw
          if ($engine -match 'ReplayGate') { throw 'ReplayGate consumer remains' }
          $deliverStart = $engine.IndexOf('private static async Task DeliverDataAsync')
          $stageStart = $engine.IndexOf('private static async Task StageBranchAsync')
          if ($deliverStart -lt 0 -or $stageStart -le $deliverStart) { throw 'Branch staging path missing' }
          $deliver = $engine.Substring($deliverStart, $stageStart - $deliverStart)
          if ($deliver -match 'SpillAsync') { throw 'Replay I/O remains inline in producer delivery' }
          if ($engine -notmatch 'EnsureWriteWindowAsync') { throw 'Adaptive write admission missing' }
          $tests = Get-ChildItem 'dotnet/RepartoCopier.Core.Tests' -Filter '*.cs' | Get-Content -Raw
          if ($tests -match 'BranchReplayGate') { throw 'Retired BranchReplayGate test remains' }
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier
      - name: Remove migration infrastructure and commit green product
        shell: pwsh
        run: |
          git rm tools/branch_isolation_migration.py tools/branch_isolation_test_fix.py .github/workflows/branch-isolation-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core dotnet/RepartoCopier.Core.Tests
          git commit -m 'perf: isolate slow FAN-OUT branches from fast destinations'
          git push origin HEAD:main
