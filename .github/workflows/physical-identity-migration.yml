name: Physical identity migration

on:
  push:
    branches: [ main ]
    paths:
      - tools/patch-physical-identity-extents.ps1
      - .github/workflows/physical-identity-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Apply migration
        shell: pwsh
        run: ./tools/patch-physical-identity-extents.ps1
      - name: Commit migration
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Migration produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core/StorageTopology.cs dotnet/RepartoCopier.Core.Tests/StorageTopologyTests.cs dotnet/RepartoCopier.Core.Tests/DeviceSchedulerTests.cs
          git commit -m 'feat: recover physical identity from volume extents'
          git push origin main
