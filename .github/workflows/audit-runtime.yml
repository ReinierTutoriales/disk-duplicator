name: Runtime hardening audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-runtime.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: false
      - name: Apply runtime hardening and regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # engine part1: runtime destination/state guards and cancelable state-log sync.
          replace_once(
              'src/engine_impl/part1.rs',
              'use std::path::{Path, PathBuf};',
              'use std::path::{Component, Path, PathBuf};'
          )

          replace_once(
