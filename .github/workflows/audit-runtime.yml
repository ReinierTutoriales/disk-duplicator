    let meta = fs::metadata(path).map_err(|e| format!("origen {}: {e}", path.display()))?;
    if !meta.is_file() || meta.len() != info.size || metadata_mtime_ns(&meta) != info.mtime_ns {
        return Err(format!("origen cambió: {}", path.display()));
    }
    Ok(())
}

fn create_directory_layout(dests: &[PathBuf], dirs: &[PathBuf]) -> Result<(), String> {
    for dest in dests {
        fs::create_dir_all(dest).map_err(|e| format!("destino {}: {e}", dest.display()))?;
        for rel in dirs {
            let path = dest.join(rel);
            fs::create_dir_all(&path)
                .map_err(|e| format!("No se pudo crear la carpeta {}: {e}", path.display()))?;
        }
    }
    Ok(())
}
''',
              '''#[cfg(windows)]
fn runtime_is_reparse_point(meta: &fs::Metadata) -> bool {
    use std::os::windows::fs::MetadataExt;
    const FILE_ATTRIBUTE_REPARSE_POINT: u32 = 0x0000_0400;
    meta.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0
}

#[cfg(not(windows))]
fn runtime_is_reparse_point(_meta: &fs::Metadata) -> bool {
    false
}

fn ensure_runtime_normal_dir(path: &Path, label: &str) -> Result<(), String> {
    let meta = fs::symlink_metadata(path)
        .map_err(|e| format!("No se pudo inspeccionar {label} {}: {e}", path.display()))?;
    if !meta.is_dir() || meta.file_type().is_symlink() || runtime_is_reparse_point(&meta) {
        return Err(format!(
            "{label} cambió o es un enlace/junction/reparse point: {}.",
            path.display()
        ));
    }
    Ok(())
}

fn validate_source_snapshot(path: &Path, info: &FileInfo) -> Result<(), String> {
    let meta = fs::symlink_metadata(path).map_err(|e| format!("origen {}: {e}", path.display()))?;
    if meta.file_type().is_symlink()
        || runtime_is_reparse_point(&meta)
        || !meta.is_file()
        || meta.len() != info.size
        || metadata_mtime_ns(&meta) != info.mtime_ns
    {
        return Err(format!("origen cambió: {}", path.display()));
    }
    Ok(())
}

fn ensure_runtime_directory(dest: &Path, rel: &Path) -> Result<(), String> {
    ensure_runtime_normal_dir(dest, "El destino")?;
    let mut current = dest.to_path_buf();
    let mut saw_component = false;
    for component in rel.components() {
        let Component::Normal(name) = component else {
            return Err(format!("Ruta relativa no segura: {}", rel.display()));
        };
        saw_component = true;
        current.push(name);
        match fs::symlink_metadata(&current) {
            Ok(_) => ensure_runtime_normal_dir(&current, "La carpeta de destino")?,
            Err(e) if e.kind() == std::io::ErrorKind::NotFound => {
                fs::create_dir(&current).map_err(|create_err| {
                    format!("No se pudo crear la carpeta {}: {create_err}", current.display())
                })?;
                ensure_runtime_normal_dir(&current, "La carpeta recién creada")?;
            }
            Err(e) => return Err(format!("No se pudo inspeccionar {}: {e}", current.display())),
        }
    }
    if !saw_component {
        return Err("Ruta relativa de carpeta vacía en el FAN-OUT.".into());
    }
    Ok(())
}

fn validate_runtime_destination_target(dest: &Path, rel: &Path) -> Result<(), String> {
    ensure_runtime_normal_dir(dest, "El destino")?;
    let mut current = dest.to_path_buf();
    let mut components = rel.components().peekable();
    if components.peek().is_none() {
        return Err("Ruta relativa vacía en el FAN-OUT.".into());
    }

    while let Some(component) = components.next() {
        let Component::Normal(name) = component else {
            return Err(format!("Ruta relativa no segura: {}", rel.display()));
        };
        current.push(name);
        let is_last = components.peek().is_none();
        match fs::symlink_metadata(&current) {
            Ok(meta) => {
                if meta.file_type().is_symlink() || runtime_is_reparse_point(&meta) {
                    return Err(format!(
                        "La ruta de destino cambió y contiene un enlace/junction/reparse point: {}.",
                        current.display()
                    ));
                }
                if is_last {
                    if !meta.is_file() {
                        return Err(format!("Conflicto de destino: {} no es un archivo normal.", current.display()));
                    }
                } else if !meta.is_dir() {
                    return Err(format!("Conflicto de destino: {} no es una carpeta.", current.display()));
                }
            }
            Err(e) if e.kind() == std::io::ErrorKind::NotFound => {
                if !is_last {
                    return Err(format!(
                        "La carpeta de destino desapareció durante la copia: {}.",
                        current.display()
                    ));
                }
            }
            Err(e) => return Err(format!("No se pudo inspeccionar {}: {e}", current.display())),
        }
    }
    Ok(())
}

fn create_directory_layout(dests: &[PathBuf], dirs: &[PathBuf]) -> Result<(), String> {
    for dest in dests {
        ensure_runtime_normal_dir(dest, "El destino")?;
        for rel in dirs {
            ensure_runtime_directory(dest, rel)?;
        }
    }
    Ok(())
}
