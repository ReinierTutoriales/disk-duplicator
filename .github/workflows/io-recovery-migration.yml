name: Adaptive I/O recovery migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/io-recovery-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply adaptive recovery cut
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one occurrence, found {text.count(old)}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          # 1. One native Win32 error semantic for buffered/direct read/direct write.
          write('dotnet/RepartoCopier.Core/TransientIoErrorClassifier.cs', '''namespace RepartoCopier.Core;

/// <summary>
/// Extracts and classifies native Win32 I/O failures without manufacturing
/// HRESULT values. Direct I/O exceptions expose their native code explicitly;
/// generic IOException values are accepted only when their HRESULT actually
/// belongs to FACILITY_WIN32.
/// </summary>
internal static class TransientIoErrorClassifier
{
    internal static bool TryGetNativeCode(Exception error, out int code)
    {
        ArgumentNullException.ThrowIfNull(error);
        switch (error)
        {
            case DirectIoDestinationWriter.DirectIoWriteException directWrite:
                code = directWrite.NativeErrorCode;
                return code > 0;

            case DirectIoSourceReader.DirectIoReadException directRead:
                code = directRead.NativeErrorCode;
                return code > 0;

            case IOException io:
            {
                var hr = unchecked((uint)io.HResult);
                if ((hr & 0xFFFF0000u) == 0x80070000u)
                {
                    code = (int)(hr & 0xFFFFu);
                    return code > 0;
                }
                break;
            }
        }

        code = 0;
        return false;
    }

    internal static int GetNativeCodeOrZero(Exception error) =>
        TryGetNativeCode(error, out var code) ? code : 0;

    internal static bool IsTransient(Exception error)
    {
        if (!TryGetNativeCode(error, out var code))
            return false;

        return code is
            32 or   // ERROR_SHARING_VIOLATION
            33 or   // ERROR_LOCK_VIOLATION
            54 or   // ERROR_NETWORK_BUSY
            64 or   // ERROR_NETNAME_DELETED
            121 or  // ERROR_SEM_TIMEOUT
            1231 or // ERROR_NETWORK_UNREACHABLE
            1232 or // ERROR_HOST_UNREACHABLE
            1233 or // ERROR_PROTOCOL_UNREACHABLE
            1236 or // ERROR_CONNECTION_ABORTED
            1237;   // ERROR_RETRY
    }

    internal static bool IsDirectFallbackable(Exception error)
    {
        if (!TryGetNativeCode(error, out var code))
            return false;

        return code is
            1 or   // ERROR_INVALID_FUNCTION
            5 or   // ERROR_ACCESS_DENIED (Direct handle/operation may be rejected)
            50 or  // ERROR_NOT_SUPPORTED
            87;    // ERROR_INVALID_PARAMETER (alignment/Direct contract rejected)
    }
}
''')

          for path in [
              'dotnet/RepartoCopier.Core/DirectIoDestinationWriter.cs',
              'dotnet/RepartoCopier.Core/DirectIoSourceReader.cs',
          ]:
              text = read(path)
              text = re.sub(
                  r'internal static bool IsFallbackable\(Exception error\) =>\s*error is DirectIo(?:Write|Read)Exception direct && direct\.NativeErrorCode is\s*1 or\s*// ERROR_INVALID_FUNCTION\s*5 or\s*// ERROR_ACCESS_DENIED\s*50 or\s*// ERROR_NOT_SUPPORTED\s*87;\s*// ERROR_INVALID_PARAMETER',
                  'internal static bool IsFallbackable(Exception error) =>\n        TransientIoErrorClassifier.IsDirectFallbackable(error)',
                  text,
                  count=1,
                  flags=re.MULTILINE)
              text = text.replace('ex.HResult & 0xFFFF', 'TransientIoErrorClassifier.GetNativeCodeOrZero(ex)')
              write(path, text)

          # 2. Negative hardware feedback: lower target immediately. Existing AcquireIoAsync
          # already freezes admissions while outstanding I/O is above the new target.
          scheduler_path = 'dotnet/RepartoCopier.Core/DeviceScheduler.cs'
          scheduler = read(scheduler_path)
          anchor = '''    public void ReserveBacklog(int bytes)\n    {'''
          if anchor not in scheduler:
              raise RuntimeError('DeviceScheduler ReserveBacklog anchor missing')
          recovery_method = '''    internal bool RecordTransientFailure()\n    {\n        lock (_ioGate)\n        {\n            ThrowIfDisposed();\n            var previous = _currentQueueDepth;\n            var bestKnown = Math.Max(1, Math.Min(_bestObservedQueueDepth, previous));\n            var next = bestKnown < previous\n                ? bestKnown\n                : Math.Max(1, previous / 2);\n\n            ResetSampleLocked();\n            if (next >= previous)\n            {\n                _lastQueueDepthDecision = "hold:transient-at-minimum";\n                return false;\n            }\n\n            _currentQueueDepth = next;\n            _queueDepthDownshifts++;\n            _lastQueueDepthDecision = "decrease:transient-failure";\n            if (next < _minimumObservedQueueDepth)\n                _minimumObservedQueueDepth = next;\n            return true;\n        }\n    }\n\n'''
          scheduler = scheduler.replace(anchor, recovery_method + anchor, 1)
          write(scheduler_path, scheduler)

          # 3. Replay A/B is a Core option, without changing the default production path.
          replace_once(
              'dotnet/RepartoCopier.Core/Models.cs',
              '''public sealed record CopyOptions(\n    bool Verify = false,\n    bool SkipSame = true,\n    bool KeepGoing = false);''',
              '''public sealed record CopyOptions(\n    bool Verify = false,\n    bool SkipSame = true,\n    bool KeepGoing = false,\n    bool EnableReplay = true);''')

          # 4. COPY: remove fixed retry count + sleeps, add adaptive bounded recovery.
          engine_path = 'dotnet/RepartoCopier.Core/CopyEngine.cs'
          engine = read(engine_path)
          engine = engine.replace('\n\n    private const int Retries = 2;\n', '\n', 1)
          engine = engine.replace(
              'var replayDirectory = BranchReplayPlacement.ResolveSafeDirectory(copy.SourceDevice, copy.DestinationDevices);',
              'var replayDirectory = options.EnableReplay\n                ? BranchReplayPlacement.ResolveSafeDirectory(copy.SourceDevice, copy.DestinationDevices)\n                : null;',
              1)

          direct_old = '''                var started = Stopwatch.GetTimestamp();\n                int operations;\n                try\n                {\n                    operations = await direct.WriteAsync(\n                        data,\n                        offset,\n                        current.Entry.Size,\n                        payloadIsAligned: true,\n                        worker.DeviceScheduler,\n                        job.Token).ConfigureAwait(false);\n                }\n                catch (Exception ex) when (DirectIoDestinationWriter.IsFallbackable(ex))\n                {\n                    current.RequestDirectFallback();\n                    return PendingWriteResult.NeedsBufferedRetry(block, offset, ex);\n                }\n'''
          direct_new = '''                var started = Stopwatch.GetTimestamp();\n                var directRetryCount = 0;\n                var lastTransientCode = 0;\n                int operations;\n                while (true)\n                {\n                    try\n                    {\n                        operations = await direct.WriteAsync(\n                            data,\n                            offset,\n                            current.Entry.Size,\n                            payloadIsAligned: true,\n                            worker.DeviceScheduler,\n                            job.Token).ConfigureAwait(false);\n                        if (directRetryCount > 0)\n                            job.Telemetry.RecordIoRecovery(\n                                "copy-write", current.Entry.RelativePath, "direct", lastTransientCode,\n                                worker.DeviceScheduler.CurrentQueueDepth, directRetryCount, offset, recovered: true);\n                        break;\n                    }\n                    catch (Exception ex) when (TransientIoErrorClassifier.IsTransient(ex))\n                    {\n                        var failedQueueDepth = worker.DeviceScheduler.CurrentQueueDepth;\n                        lastTransientCode = TransientIoErrorClassifier.GetNativeCodeOrZero(ex);\n                        directRetryCount++;\n                        worker.Progress.AddRetry();\n                        job.Telemetry.RecordIoRecovery(\n                            "copy-write", current.Entry.RelativePath, "direct", lastTransientCode,\n                            failedQueueDepth, directRetryCount, offset, recovered: false);\n                        var reduced = worker.DeviceScheduler.RecordTransientFailure();\n                        if (!reduced)\n                        {\n                            ReleaseBranchBlock(worker, block);\n                            return PendingWriteResult.Failed(ex);\n                        }\n                    }\n                    catch (Exception ex) when (DirectIoDestinationWriter.IsFallbackable(ex))\n                    {\n                        current.RequestDirectFallback();\n                        return PendingWriteResult.NeedsBufferedRetry(block, offset, ex);\n                    }\n                }\n'''
          if direct_old not in engine:
              raise RuntimeError('Direct write block not found')
          engine = engine.replace(direct_old, direct_new, 1)

          buffered_pattern = re.compile(r'''        for \(var attempt = 0; attempt <= Retries; attempt\+\+\)\n        \{\n            try\n            \{\n(?P<body>.*?)                return PendingWriteResult\.Success\(\);\n            \}\n            catch \(Exception ex\)\n            \{\n                last = ex;\n                if \(attempt >= Retries \|\| !TransientIoErrorClassifier\.IsTransient\(ex\)\)\n                    break;\n                worker\.Progress\.AddRetry\(\);\n                try\n                \{\n                    await Task\.Delay\(75 \* \(attempt \+ 1\), job\.Token\)\.ConfigureAwait\(false\);\n                \}\n                catch \(Exception delayError\)\n                \{\n                    last = delayError;\n                    break;\n                \}\n            \}\n        \}\n''', re.DOTALL)
          match = buffered_pattern.search(engine)
          if not match:
              raise RuntimeError('Buffered retry block not found')
          body = match.group('body')
          buffered_new = '''        var bufferedRetryCount = 0;\n        var lastBufferedTransientCode = 0;\n        while (true)\n        {\n            try\n            {\n''' + body + '''                if (bufferedRetryCount > 0)\n                    job.Telemetry.RecordIoRecovery(\n                        "copy-write", current.Entry.RelativePath, "buffered", lastBufferedTransientCode,\n                        worker.DeviceScheduler.CurrentQueueDepth, bufferedRetryCount, offset, recovered: true);\n                return PendingWriteResult.Success();\n            }\n            catch (Exception ex)\n            {\n                last = ex;\n                if (!TransientIoErrorClassifier.IsTransient(ex))\n                    break;\n\n                var failedQueueDepth = worker.DeviceScheduler.CurrentQueueDepth;\n                lastBufferedTransientCode = TransientIoErrorClassifier.GetNativeCodeOrZero(ex);\n                bufferedRetryCount++;\n                worker.Progress.AddRetry();\n                job.Telemetry.RecordIoRecovery(\n                    "copy-write", current.Entry.RelativePath, "buffered", lastBufferedTransientCode,\n                    failedQueueDepth, bufferedRetryCount, offset, recovered: false);\n                if (!worker.DeviceScheduler.RecordTransientFailure())\n                    break;\n            }\n        }\n'''
          engine = engine[:match.start()] + buffered_new + engine[match.end():]
          write(engine_path, engine)

          # 5. VERIFY: recover both Direct and buffered reads using the same classifier/scheduler.
          verify_path = 'dotnet/RepartoCopier.Core/FastVerificationReader.cs'
          verify = read(verify_path)
          verify = verify.replace(
              'ReadDirectAsync(session, scheduler, lease, requestSize, offset, job.Token)',
              'ReadDirectAsync(session, scheduler, lease, requestSize, offset, path, job, progress)',
              1)
          verify = verify.replace(
              '''ReadBufferedAsync(\n                            handle,\n                            scheduler,\n                            lease,\n                            expected.Length,\n                            offset,\n                            job.Token)''',
              '''ReadBufferedAsync(\n                            handle,\n                            scheduler,\n                            lease,\n                            expected.Length,\n                            offset,\n                            path,\n                            job,\n                            progress)''',
              1)

          old_direct_helper = '''    private static async Task<int> ReadDirectAsync(\n        DirectIoSourceReader.OverlappedSession session,\n        DeviceScheduler scheduler,\n        SourceBufferLease buffer,\n        int requestSize,\n        long offset,\n        CancellationToken token)\n    {\n        using var io = await scheduler.AcquireIoAsync(requestSize, token).ConfigureAwait(false);\n        return await session.ReadAsync(buffer, requestSize, offset, token).ConfigureAwait(false);\n    }\n'''
          new_direct_helper = '''    private static async Task<int> ReadDirectAsync(\n        DirectIoSourceReader.OverlappedSession session,\n        DeviceScheduler scheduler,\n        SourceBufferLease buffer,\n        int requestSize,\n        long offset,\n        string path,\n        CopyJob job,\n        DestinationProgress progress)\n    {\n        var retries = 0;\n        var lastCode = 0;\n        while (true)\n        {\n            using var io = await scheduler.AcquireIoAsync(requestSize, job.Token).ConfigureAwait(false);\n            try\n            {\n                var read = await session.ReadAsync(buffer, requestSize, offset, job.Token).ConfigureAwait(false);\n                if (retries > 0)\n                    job.Telemetry.RecordIoRecovery(\n                        "verify-read", path, "direct", lastCode, scheduler.CurrentQueueDepth, retries, offset, recovered: true);\n                return read;\n            }\n            catch (Exception ex) when (TransientIoErrorClassifier.IsTransient(ex))\n            {\n                var failedQueueDepth = scheduler.CurrentQueueDepth;\n                lastCode = TransientIoErrorClassifier.GetNativeCodeOrZero(ex);\n                retries++;\n                progress.AddRetry();\n                job.Telemetry.RecordIoRecovery(\n                    "verify-read", path, "direct", lastCode, failedQueueDepth, retries, offset, recovered: false);\n                if (!scheduler.RecordTransientFailure())\n                    throw;\n            }\n        }\n    }\n'''
          if old_direct_helper not in verify:
              raise RuntimeError('Verify direct helper not found')
          verify = verify.replace(old_direct_helper, new_direct_helper, 1)

          old_buffered_helper = '''    private static async Task<int> ReadBufferedAsync(\n        SafeFileHandle handle,\n        DeviceScheduler scheduler,\n        SourceBufferLease buffer,\n        int requestSize,\n        long offset,\n        CancellationToken token)\n    {\n        using var io = await scheduler.AcquireIoAsync(requestSize, token).ConfigureAwait(false);\n        return await RandomAccess.ReadAsync(handle, buffer.Memory[..requestSize], offset, token).ConfigureAwait(false);\n    }\n'''
          new_buffered_helper = '''    private static async Task<int> ReadBufferedAsync(\n        SafeFileHandle handle,\n        DeviceScheduler scheduler,\n        SourceBufferLease buffer,\n        int requestSize,\n        long offset,\n        string path,\n        CopyJob job,\n        DestinationProgress progress)\n    {\n        var retries = 0;\n        var lastCode = 0;\n        while (true)\n        {\n            using var io = await scheduler.AcquireIoAsync(requestSize, job.Token).ConfigureAwait(false);\n            try\n            {\n                var read = await RandomAccess.ReadAsync(\n                    handle, buffer.Memory[..requestSize], offset, job.Token).ConfigureAwait(false);\n                if (retries > 0)\n                    job.Telemetry.RecordIoRecovery(\n                        "verify-read", path, "buffered", lastCode, scheduler.CurrentQueueDepth, retries, offset, recovered: true);\n                return read;\n            }\n            catch (Exception ex) when (TransientIoErrorClassifier.IsTransient(ex))\n            {\n                var failedQueueDepth = scheduler.CurrentQueueDepth;\n                lastCode = TransientIoErrorClassifier.GetNativeCodeOrZero(ex);\n                retries++;\n                progress.AddRetry();\n                job.Telemetry.RecordIoRecovery(\n                    "verify-read", path, "buffered", lastCode, failedQueueDepth, retries, offset, recovered: false);\n                if (!scheduler.RecordTransientFailure())\n                    throw;\n            }\n        }\n    }\n'''
          if old_buffered_helper not in verify:
              raise RuntimeError('Verify buffered helper not found')
          verify = verify.replace(old_buffered_helper, new_buffered_helper, 1)
          write(verify_path, verify)

          # 6. Diagnostics surface: exact recent I/O recovery events.
          telemetry_path = 'dotnet/RepartoCopier.Core/CopyTelemetry.cs'
          telemetry = read(telemetry_path)
          telemetry = telemetry.replace('using System.Diagnostics;\n', 'using System.Collections.Concurrent;\nusing System.Diagnostics;\n', 1)
          marker = 'public enum VerificationBottleneckKind\n'
          telemetry = telemetry.replace(marker, '''public sealed record IoRecoveryEvent(\n    DateTimeOffset Timestamp,\n    string Phase,\n    string Path,\n    string Mode,\n    int NativeErrorCode,\n    int QueueDepth,\n    int RetryCount,\n    long Offset,\n    bool Recovered);\n\n''' + marker, 1)
          telemetry = telemetry.replace(
              '    public int MaximumTransferBytes { get; init; }\n',
              '    public int MaximumTransferBytes { get; init; }\n    public IReadOnlyList<IoRecoveryEvent> RecentIoRecoveryEvents { get; init; } = [];\n',
              1)
          telemetry = telemetry.replace(
              '    private readonly SlidingByteRateWindow _writeRate = new();\n',
              '    private readonly SlidingByteRateWindow _writeRate = new();\n    private readonly ConcurrentQueue<IoRecoveryEvent> _ioRecoveryEvents = new();\n',
              1)
          telemetry = telemetry.replace(
              '    internal void RecordDirectDestinationFallback() => Interlocked.Increment(ref _directDestinationFallbacks);\n',
              '''    internal void RecordDirectDestinationFallback() => Interlocked.Increment(ref _directDestinationFallbacks);\n    internal void RecordIoRecovery(\n        string phase,\n        string path,\n        string mode,\n        int nativeErrorCode,\n        int queueDepth,\n        int retryCount,\n        long offset,\n        bool recovered)\n    {\n        _ioRecoveryEvents.Enqueue(new IoRecoveryEvent(\n            DateTimeOffset.UtcNow, phase, path, mode, nativeErrorCode,\n            Math.Max(1, queueDepth), Math.Max(0, retryCount), offset, recovered));\n        while (_ioRecoveryEvents.Count > 128 && _ioRecoveryEvents.TryDequeue(out _)) { }\n    }\n''',
              1)
          telemetry = telemetry.replace(
              '            MaximumTransferBytes = Volatile.Read(ref _maximumTransferBytes),\n',
              '            MaximumTransferBytes = Volatile.Read(ref _maximumTransferBytes),\n            RecentIoRecoveryEvents = _ioRecoveryEvents.ToArray(),\n',
              1)
          write(telemetry_path, telemetry)

          # 7. UI: verification remains safe-by-default but is user-configurable.
          xaml_path = 'dotnet/RepartoCopier.WinUI/MainWindow.xaml'
          xaml = read(xaml_path)
          xaml = xaml.replace(
              '''                        <CheckBox x:Name="SkipSameCheck" Content="Omitir archivos iguales" />\n                        <CheckBox x:Name="KeepGoingCheck" Content="Continuar si un destino falla" />''',
              '''                        <CheckBox x:Name="VerifyCheck" Content="Verificar después de copiar" IsChecked="True" />\n                        <CheckBox x:Name="SkipSameCheck" Content="Omitir archivos iguales" />\n                        <CheckBox x:Name="KeepGoingCheck" Content="Continuar si un destino falla" />''',
              1)
          write(xaml_path, xaml)

          ui_path = 'dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs'
          ui = read(ui_path)
          ui = ui.replace('Verify: true,', 'Verify: VerifyCheck.IsChecked == true,', 1)
          ui = ui.replace(
              '        SkipSameCheck.IsEnabled = enabled;\n        KeepGoingCheck.IsEnabled = enabled;',
              '        VerifyCheck.IsEnabled = enabled;\n        SkipSameCheck.IsEnabled = enabled;\n        KeepGoingCheck.IsEnabled = enabled;',
              1)
          ui = ui.replace(
              '            OverallDetailText.Text = "Preparando copia con verificación rápida...";',
              '            OverallDetailText.Text = options.Verify\n                ? "Preparando copia con verificación rápida..."\n                : "Preparando copia sin verificación posterior...";',
              1)
          write(ui_path, ui)

          # 8. Regression/architecture contracts.
          test_path = 'dotnet/RepartoCopier.Core.Tests/RetryAndReplayArchitectureTests.cs'
          tests = read(test_path)
          insertion = '''\n    [TestMethod]\n    public void NativeCodeExtractionRejectsNonWin32IOExceptionHResult()\n    {\n        var error = new IOException("managed", unchecked((int)0x80131500));\n        Assert.IsFalse(TransientIoErrorClassifier.TryGetNativeCode(error, out _));\n        Assert.IsFalse(TransientIoErrorClassifier.IsTransient(error));\n    }\n\n    [TestMethod]\n    public void DirectNativeErrorsUseTheSameClassifier()\n    {\n        var write = new DirectIoDestinationWriter.DirectIoWriteException(121, "synthetic");\n        var read = new DirectIoSourceReader.DirectIoReadException(1237, "synthetic");\n        Assert.IsTrue(TransientIoErrorClassifier.IsTransient(write));\n        Assert.IsTrue(TransientIoErrorClassifier.IsTransient(read));\n        Assert.AreEqual(121, TransientIoErrorClassifier.GetNativeCodeOrZero(write));\n        Assert.AreEqual(1237, TransientIoErrorClassifier.GetNativeCodeOrZero(read));\n    }\n\n    [TestMethod]\n    public void TransientFailureImmediatelyReducesSchedulerPressureWithoutStaticSataCap()\n    {\n        using var scheduler = new DeviceScheduler("synthetic", 8, 64 * 1024 * 1024);\n        Assert.AreEqual(8, scheduler.CurrentQueueDepth);\n        Assert.IsTrue(scheduler.RecordTransientFailure());\n        Assert.AreEqual(4, scheduler.CurrentQueueDepth);\n        Assert.IsTrue(scheduler.RecordTransientFailure());\n        Assert.AreEqual(2, scheduler.CurrentQueueDepth);\n        Assert.IsTrue(scheduler.RecordTransientFailure());\n        Assert.AreEqual(1, scheduler.CurrentQueueDepth);\n        Assert.IsFalse(scheduler.RecordTransientFailure());\n    }\n\n    [TestMethod]\n    public void ReplayCanBeDisabledForPhysicalABWithoutChangingDefault()\n    {\n        Assert.IsTrue(new CopyOptions().EnableReplay);\n        Assert.IsFalse(new CopyOptions(EnableReplay: false).EnableReplay);\n    }\n\n    [TestMethod]\n    public void DiagnosticsExposeExactIoRecoveryContext()\n    {\n        var telemetry = new CopyTelemetry();\n        telemetry.RecordIoRecovery("verify-read", "D:\\\\x.bin", "direct", 121, 16, 1, 4096, recovered: false);\n        var item = telemetry.Snapshot().RecentIoRecoveryEvents.Single();\n        Assert.AreEqual("verify-read", item.Phase);\n        Assert.AreEqual("direct", item.Mode);\n        Assert.AreEqual(121, item.NativeErrorCode);\n        Assert.AreEqual(16, item.QueueDepth);\n        Assert.AreEqual(1, item.RetryCount);\n        Assert.AreEqual(4096L, item.Offset);\n        Assert.IsFalse(item.Recovered);\n    }\n'''
          anchor = '    private static StorageDeviceInfo Device(string root, uint? physicalDeviceNumber) =>\n'
          if anchor not in tests:
              raise RuntimeError('Retry/replay tests insertion anchor missing')
          tests = tests.replace(anchor, insertion + '\n' + anchor, 1)
          write(test_path, tests)

          # Contract against reintroducing the old arbitrary retry/sleep policy.
          architecture_path = 'dotnet/RepartoCopier.Core.Tests/UnificationContractTests.cs'
          architecture = read(architecture_path)
          class_end = architecture.rfind('\n}')
          if class_end < 0:
              raise RuntimeError('UnificationContractTests class end missing')
          contract = '''\n\n    [TestMethod]\n    public void IoRecoveryHasOneAdaptiveProductionPolicy()\n    {\n        var root = FindRepositoryRoot();\n        var engine = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.Core", "CopyEngine.cs"));\n        var verify = File.ReadAllText(Path.Combine(root, "dotnet", "RepartoCopier.Core", "FastVerificationReader.cs"));\n        Assert.IsFalse(engine.Contains("private const int Retries = 2", StringComparison.Ordinal));\n        Assert.IsFalse(engine.Contains("Task.Delay(75 *", StringComparison.Ordinal));\n        Assert.IsTrue(engine.Contains("RecordTransientFailure", StringComparison.Ordinal));\n        Assert.IsTrue(verify.Contains("RecordTransientFailure", StringComparison.Ordinal));\n        Assert.IsTrue(verify.Contains("TransientIoErrorClassifier.IsTransient", StringComparison.Ordinal));\n    }\n'''
          architecture = architecture[:class_end] + contract + architecture[class_end:]
          write(architecture_path, architecture)

          # Remove this one-shot migration workflow from the resulting product commit.
          Path('.github/workflows/io-recovery-migration.yml').unlink()
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\apply_io_recovery.py"
          python "$env:RUNNER_TEMP\apply_io_recovery.py"

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit green migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: unify adaptive I/O recovery and optional verify"
          git push origin HEAD:main
