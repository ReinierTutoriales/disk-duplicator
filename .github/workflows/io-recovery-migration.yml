name: Adaptive I/O recovery migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/io-recovery-migration.yml'
      - '.github/scripts/io_recovery_migration.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply adaptive recovery cut
        run: python .github/scripts/io_recovery_migration.py

      - name: Fix generated Windows path literal
        shell: pwsh
        run: |
          $path = 'dotnet/RepartoCopier.Core.Tests/IoRecoveryArchitectureTests.cs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('"D:\x.bin"', '@"D:\x.bin"')
          Set-Content -Path $path -Value $text -Encoding utf8

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit green migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: unify adaptive I/O recovery and optional verify"
          git push origin HEAD:main
