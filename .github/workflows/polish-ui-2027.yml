name: Apply Fluent 2027 polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-ui-2027.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Polish WinUI layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          xaml_path = Path('dotnet/RepartoCopier.WinUI/MainWindow.xaml')
          x = xaml_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global x
              if old not in x:
                  raise SystemExit(f'missing XAML pattern: {label}')
              x = x.replace(old, new, 1)

          replace_once('''            <Style x:Key="CompactActionButtonStyle" TargetType="Button">\n                <Setter Property="Height" Value="38" />\n                <Setter Property="MinWidth" Value="92" />\n                <Setter Property="Padding" Value="12,0" />\n                <Setter Property="CornerRadius" Value="7" />\n            </Style>''', '''            <Style x:Key="CompactActionButtonStyle" TargetType="Button">\n                <Setter Property="Height" Value="42" />\n                <Setter Property="MinWidth" Value="100" />\n                <Setter Property="Padding" Value="14,0" />\n                <Setter Property="CornerRadius" Value="8" />\n            </Style>\n            <Style x:Key="MenuButtonStyle" TargetType="Button">\n                <Setter Property="Height" Value="46" />\n                <Setter Property="HorizontalContentAlignment" Value="Left" />\n                <Setter Property="Padding" Value="14,0" />\n                <Setter Property="CornerRadius" Value="7" />\n                <Setter Property="Background" Value="Transparent" />\n                <Setter Property="BorderThickness" Value="0" />\n            </Style>''', 'button styles')

          replace_once('''            <RowDefinition Height="66" />\n            <RowDefinition Height="*" />\n            <RowDefinition Height="34" />''', '''            <RowDefinition Height="78" />\n            <RowDefinition Height="*" />\n            <RowDefinition Height="42" />''', 'root rows')
          replace_once('Padding="18,0,10,0"', 'Padding="30,0,156,0"', 'title padding')

          replace_once('''            <Border Width="40" Height="40" CornerRadius="9" VerticalAlignment="Center"\n                    Background="{ThemeResource AccentFillColorDefaultBrush}">\n                <Image x:Name="LogoImage" Width="34" Height="34" Stretch="Uniform" HorizontalAlignment="Center" VerticalAlignment="Center" />\n            </Border>''', '''            <Image x:Name="LogoImage" Width="54" Height="54" Stretch="Uniform"\n                   HorizontalAlignment="Center" VerticalAlignment="Center" />''', 'brand logo')

          replace_once('''            <StackPanel Grid.Column="1" Margin="12,0,0,0" VerticalAlignment="Center" Spacing="1">\n                <TextBlock Text="RepartoCopier" FontSize="17" FontWeight="SemiBold" />\n                <TextBlock Text="Copias rápidas y seguras" Opacity="0.62" FontSize="11" />\n            </StackPanel>''', '''            <StackPanel Grid.Column="1" Margin="16,0,0,0" VerticalAlignment="Center" Spacing="2">\n                <TextBlock Text="RepartoCopier" FontSize="21" FontWeight="SemiBold" />\n                <TextBlock Text="Copias rápidas y seguras" Opacity="0.66" FontSize="13" />\n            </StackPanel>''', 'brand text')

          replace_once('''                    Width="42"\n                    Height="38"''', '''                    Width="48"\n                    Height="44"''', 'menu size')
          replace_once('CornerRadius="8"\n                    ToolTipService.ToolTip="Menú">\n                <FontIcon Glyph="&#xE700;" FontSize="18" />', 'CornerRadius="10"\n                    ToolTipService.ToolTip="Menú">\n                <FontIcon Glyph="&#xE700;" FontSize="20" />', 'menu icon')

          flyout = '''                <Button.Flyout>\n                    <Flyout Placement="BottomEdgeAlignedRight">\n                        <Border Width="224" Padding="7" CornerRadius="10"\n                                Background="{ThemeResource AcrylicBackgroundFillColorDefaultBrush}"\n                                BorderBrush="{ThemeResource CardStrokeColorDefaultBrush}" BorderThickness="1">\n                            <StackPanel Spacing="2">\n                                <Button Style="{StaticResource MenuButtonStyle}" Click="LoadProfile_Click">\n                                    <StackPanel Orientation="Horizontal" Spacing="12"><FontIcon Glyph="&#xE8E5;" FontSize="18"/><TextBlock Text="Cargar copia..." FontSize="14"/></StackPanel>\n                                </Button>\n                                <Button Style="{StaticResource MenuButtonStyle}" Click="SaveProfile_Click">\n                                    <StackPanel Orientation="Horizontal" Spacing="12"><FontIcon Glyph="&#xE74E;" FontSize="18"/><TextBlock Text="Guardar copia..." FontSize="14"/></StackPanel>\n                                </Button>\n                                <Rectangle Height="1" Margin="8,5" Fill="{ThemeResource DividerStrokeColorDefaultBrush}" />\n                                <Button Style="{StaticResource MenuButtonStyle}" Click="Settings_Click">\n                                    <StackPanel Orientation="Horizontal" Spacing="12"><FontIcon Glyph="&#xE713;" FontSize="18"/><TextBlock Text="Ajustes" FontSize="14"/></StackPanel>\n                                </Button>\n                                <Button Style="{StaticResource MenuButtonStyle}" Click="About_Click">\n                                    <StackPanel Orientation="Horizontal" Spacing="12"><FontIcon Glyph="&#xE946;" FontSize="18"/><TextBlock Text="Acerca de" FontSize="14"/></StackPanel>\n                                </Button>\n                                <Rectangle Height="1" Margin="8,5" Fill="{ThemeResource DividerStrokeColorDefaultBrush}" />\n                                <Button Style="{StaticResource MenuButtonStyle}" Click="Exit_Click">\n                                    <StackPanel Orientation="Horizontal" Spacing="12"><FontIcon Glyph="&#xE8BB;" FontSize="18"/><TextBlock Text="Salir" FontSize="14"/></StackPanel>\n                                </Button>\n                            </StackPanel>\n                        </Border>\n                    </Flyout>\n                </Button.Flyout>'''
          x, count = re.subn(r'                <Button\.Flyout>\s*<MenuFlyout Placement="BottomEdgeAlignedRight">.*?</MenuFlyout>\s*</Button\.Flyout>', flyout, x, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('failed to replace hamburger flyout')

          replace_once('<Grid Grid.Row="1" Margin="22,4,22,14" MaxWidth="1180" HorizontalAlignment="Center">', '<Grid Grid.Row="1" Margin="34,8,34,18" MaxWidth="1380" HorizontalAlignment="Stretch">', 'main content')
          replace_once('<Grid x:Name="PreparationPanel" Visibility="Visible" RowSpacing="14" MaxWidth="760">', '<Grid x:Name="PreparationPanel" Visibility="Visible" RowSpacing="16" MaxWidth="820" HorizontalAlignment="Center">', 'prep panel')
          replace_once('''                <StackPanel Spacing="3" Margin="2,4,0,0">\n                    <TextBlock Text="Nueva copia" FontSize="27" FontWeight="SemiBold" />\n                    <TextBlock Text="Elige qué quieres copiar y dónde quieres guardarlo." Opacity="0.68" FontSize="13" />\n                </StackPanel>''', '''                <StackPanel Spacing="4" Margin="0,0,0,2">\n                    <TextBlock Text="Nueva copia" FontSize="29" FontWeight="SemiBold" />\n                    <TextBlock Text="Elige qué quieres copiar y dónde quieres guardarlo." Opacity="0.68" FontSize="14" />\n                </StackPanel>''', 'prep heading')
          x = x.replace('Style="{StaticResource SurfaceCardStyle}" Padding="16,14"', 'Style="{StaticResource SurfaceCardStyle}" Padding="18,16"', 2)
          replace_once('<TextBox x:Name="SourcePathBox" Height="38"', '<TextBox x:Name="SourcePathBox" Height="42"', 'source height')
          replace_once('<ListView x:Name="DestinationList" Grid.Row="1" SelectionMode="None" MaxHeight="178"', '<ListView x:Name="DestinationList" Grid.Row="1" SelectionMode="None" MaxHeight="204"', 'dest list')
          x = x.replace('<Setter Property="MinHeight" Value="36" />', '<Setter Property="MinHeight" Value="42" />', 1)
          x = x.replace('<Grid MinHeight="36" Padding="8,2" ColumnSpacing="9">', '<Grid MinHeight="42" Padding="10,3" ColumnSpacing="10">', 1)
          replace_once('Height="40" MinWidth="140" CornerRadius="7" Click="Start_Click"', 'Height="44" MinWidth="152" CornerRadius="8" Click="Start_Click"', 'start button')

          replace_once('<Grid x:Name="RunningPanel" Visibility="Collapsed" RowSpacing="12">', '<Grid x:Name="RunningPanel" Visibility="Collapsed" RowSpacing="14">', 'running spacing')
          replace_once('''                <Border Style="{StaticResource SurfaceCardStyle}" Padding="16,14">''', '''                <Border Style="{StaticResource SurfaceCardStyle}" Padding="18,16">''', 'running header padding')
          replace_once('''                        <Border Width="58" Height="58" CornerRadius="10" Background="{ThemeResource ControlFillColorDefaultBrush}" VerticalAlignment="Center">\n                            <FontIcon x:Name="OperationIcon" Glyph="&#xE8A5;" FontSize="26" HorizontalAlignment="Center" VerticalAlignment="Center" />\n                        </Border>''', '''                        <Border Width="64" Height="64" CornerRadius="12" Background="{ThemeResource ControlFillColorDefaultBrush}" VerticalAlignment="Center">\n                            <FontIcon x:Name="OperationIcon" Glyph="&#xE8A5;" FontSize="30" HorizontalAlignment="Center" VerticalAlignment="Center" />\n                        </Border>''', 'operation icon')
          replace_once('''                        <StackPanel Grid.Column="1" Spacing="2" VerticalAlignment="Center" MinWidth="280">\n                            <TextBlock x:Name="OperationTitleText" Text="Copiando..." FontSize="13" Opacity="0.86" />\n                            <TextBlock x:Name="CurrentFileText" Text="Preparando..." FontSize="24" FontWeight="SemiBold" TextTrimming="CharacterEllipsis" MaxLines="1" />\n                            <TextBlock x:Name="CurrentPathText" Opacity="0.60" FontSize="12" TextTrimming="CharacterEllipsis" MaxLines="1" />\n                        </StackPanel>''', '''                        <StackPanel Grid.Column="1" Spacing="3" VerticalAlignment="Center" MinWidth="330">\n                            <TextBlock x:Name="OperationTitleText" Text="Copiando..." FontSize="14" Opacity="0.88" />\n                            <TextBlock x:Name="CurrentFileText" Text="Preparando..." FontSize="25" FontWeight="SemiBold" TextTrimming="CharacterEllipsis" MaxLines="1" />\n                            <TextBlock x:Name="CurrentPathText" Opacity="0.62" FontSize="12" TextTrimming="CharacterEllipsis" MaxLines="1" />\n                        </StackPanel>''', 'current file block')

          old_metrics = '''                        <Grid Grid.Column="2" ColumnSpacing="18" VerticalAlignment="Center">\n                            <Grid.ColumnDefinitions>\n                                <ColumnDefinition Width="Auto" />\n                                <ColumnDefinition Width="Auto" />\n                                <ColumnDefinition Width="Auto" />\n                            </Grid.ColumnDefinitions>\n\n                            <StackPanel Spacing="2" MinWidth="122">\n                                <TextBlock Text="Velocidad" Opacity="0.58" FontSize="11" />\n                                <TextBlock x:Name="SpeedMetricText" Text="0 MiB/s" FontSize="19" FontWeight="SemiBold" />\n                            </StackPanel>\n                            <StackPanel Grid.Column="1" Spacing="2" MinWidth="130">\n                                <TextBlock Text="Tiempo restante" Opacity="0.58" FontSize="11" />\n                                <TextBlock x:Name="RemainingMetricText" Text="--:--:--" FontSize="19" FontWeight="SemiBold" />\n                            </StackPanel>\n                            <StackPanel Grid.Column="2" Spacing="2" MinWidth="100">\n                                <TextBlock Text="Archivos" Opacity="0.58" FontSize="11" />\n                                <TextBlock x:Name="FilesMetricText" Text="0" FontSize="19" FontWeight="SemiBold" />\n                            </StackPanel>\n                        </Grid>'''
          new_metrics = '''                        <Grid Grid.Column="2" VerticalAlignment="Center">\n                            <Grid.ColumnDefinitions>\n                                <ColumnDefinition Width="Auto"/><ColumnDefinition Width="1"/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="1"/><ColumnDefinition Width="Auto"/>\n                            </Grid.ColumnDefinitions>\n                            <Grid Margin="18,0">\n                                <Grid.ColumnDefinitions><ColumnDefinition Width="Auto"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>\n                                <FontIcon Glyph="&#xE9D9;" FontSize="23" Opacity="0.76" Margin="0,0,10,0" VerticalAlignment="Center"/>\n                                <StackPanel Grid.Column="1" Spacing="2" MinWidth="112"><TextBlock Text="Velocidad" Opacity="0.60" FontSize="11"/><TextBlock x:Name="SpeedMetricText" Text="0 MiB/s" FontSize="20" FontWeight="SemiBold"/></StackPanel>\n                            </Grid>\n                            <Rectangle Grid.Column="1" Width="1" Margin="4,2" Fill="{ThemeResource DividerStrokeColorDefaultBrush}" />\n                            <Grid Grid.Column="2" Margin="18,0">\n                                <Grid.ColumnDefinitions><ColumnDefinition Width="Auto"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>\n                                <FontIcon Glyph="&#xE916;" FontSize="23" Opacity="0.76" Margin="0,0,10,0" VerticalAlignment="Center"/>\n                                <StackPanel Grid.Column="1" Spacing="2" MinWidth="120"><TextBlock Text="Tiempo restante" Opacity="0.60" FontSize="11"/><TextBlock x:Name="RemainingMetricText" Text="--:--:--" FontSize="20" FontWeight="SemiBold"/></StackPanel>\n                            </Grid>\n                            <Rectangle Grid.Column="3" Width="1" Margin="4,2" Fill="{ThemeResource DividerStrokeColorDefaultBrush}" />\n                            <Grid Grid.Column="4" Margin="18,0">\n                                <Grid.ColumnDefinitions><ColumnDefinition Width="Auto"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>\n                                <FontIcon Glyph="&#xE8A5;" FontSize="22" Opacity="0.76" Margin="0,0,10,0" VerticalAlignment="Center"/>\n                                <StackPanel Grid.Column="1" Spacing="2" MinWidth="86"><TextBlock Text="Archivos" Opacity="0.60" FontSize="11"/><TextBlock x:Name="FilesMetricText" Text="0" FontSize="20" FontWeight="SemiBold"/></StackPanel>\n                            </Grid>\n                        </Grid>'''
          replace_once(old_metrics, new_metrics, 'metrics')

          replace_once('<Border Grid.Row="1" Style="{StaticResource SurfaceCardStyle}" Padding="16,12">', '<Border Grid.Row="1" Style="{StaticResource SurfaceCardStyle}" Padding="18,14">', 'progress card')
          replace_once('<ProgressBar x:Name="OverallProgressBar" Grid.Row="1" Height="5"', '<ProgressBar x:Name="OverallProgressBar" Grid.Row="1" Height="6"', 'overall bar')
          replace_once('<TextBlock x:Name="RunningDestinationTitle" Text="Destinos" FontSize="16"', '<TextBlock x:Name="RunningDestinationTitle" Text="Destinos" FontSize="17"', 'destination heading')
          x = x.replace('<Setter Property="MinHeight" Value="50" />', '<Setter Property="MinHeight" Value="58" />', 1)
          x = x.replace('<ColumnDefinition Width="135" />', '<ColumnDefinition Width="190" />', 1)
          x = x.replace('<ColumnDefinition Width="110" />\n                                        </Grid.ColumnDefinitions>', '<ColumnDefinition Width="128" />\n                                            <ColumnDefinition Width="Auto" />\n                                        </Grid.ColumnDefinitions>', 1)
          x = x.replace('<Border Width="32" Height="32" CornerRadius="7"', '<Border Width="38" Height="38" CornerRadius="8"', 1)
          x = x.replace('<ProgressBar Grid.Column="2" Height="5"', '<ProgressBar Grid.Column="2" Height="6"', 1)
          phase_pattern = re.compile(r'(<StackPanel Grid.Column="5" Orientation="Horizontal".*?</StackPanel>)', re.S)
          x, count = phase_pattern.subn(r'''\1\n                                        <Button Grid.Column="6" Width="34" Height="34" Padding="0" CornerRadius="7" ToolTipService.ToolTip="Detalles" IsHitTestVisible="False"><FontIcon Glyph="&#xE712;" FontSize="16"/></Button>''', x, count=1)
          if count != 1:
              raise SystemExit('failed to add destination details affordance')

          replace_once('Padding="16,0" BorderThickness="0,1,0,0"', 'Padding="24,0" BorderThickness="0,1,0,0"', 'footer padding')
          xaml_path.write_text(x, encoding='utf-8')

          cs_path = Path('dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs')
          cs = cs_path.read_text(encoding='utf-8')
          if 'AppWindow.Resize(new SizeInt32(1080, 700));' not in cs:
              raise SystemExit('missing window size pattern')
          cs = cs.replace('AppWindow.Resize(new SizeInt32(1080, 700));', 'AppWindow.Resize(new SizeInt32(1180, 760));', 1)
          cs = cs.replace('''\n        // Keep our menu completely outside the Windows caption-button hit-test area.\n        // This intentionally mirrors the visual spacing from the approved mockup.\n        AppMenuButton.Margin = new Thickness(0, 0, 140, 0);\n''', '\n', 1)
          cs_path.write_text(cs, encoding='utf-8')

          ci_path = Path('.github/workflows/windows-dotnet.yml')
          ci = ci_path.read_text(encoding='utf-8')
          if 'actions/upload-artifact@v4' not in ci:
              raise SystemExit('upload-artifact version pattern missing')
          ci = ci.replace('actions/upload-artifact@v4', 'actions/upload-artifact@v5', 1)
          ci_path.write_text(ci, encoding='utf-8')
          PY

      - name: Commit polished UI
        shell: bash
        run: |
          git config user.name "ReinierTutoriales"
          git config user.email "86568548+ReinierTutoriales@users.noreply.github.com"
          rm .github/workflows/polish-ui-2027.yml
          git add dotnet/RepartoCopier.WinUI/MainWindow.xaml dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs .github/workflows/windows-dotnet.yml .github/workflows/polish-ui-2027.yml
          git commit -m "ui: polish Fluent 2027 layout toward approved mockup"
          git push origin main
