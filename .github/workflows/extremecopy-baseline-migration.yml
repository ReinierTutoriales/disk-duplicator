name: Shared FAN-OUT baseline migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/extremecopy_baseline_migration.py'
      - 'tools/extremecopy_migration_hotfix.py'
      - '.github/workflows/extremecopy-baseline-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply shared FAN-OUT baseline migration
        shell: pwsh
        run: |
          python tools/extremecopy_migration_hotfix.py
          python tools/extremecopy_baseline_migration.py
      - name: Architecture guards
        shell: pwsh
        run: |
          $product = @(
            Get-ChildItem dotnet/RepartoCopier.Core -Recurse -Filter *.cs
            Get-ChildItem dotnet/RepartoCopier.WinUI -Recurse -Filter *.cs
          )
          $all = ($product | Get-Content -Raw) -join "`n"
          $forbidden = @('BranchReplayStore','BranchReplayPlacement','BranchIsolationPolicy','StageBranchAsync','DetachBranchBlock','ReplayDataMessage','FastVerificationReader','VerificationReadBudget','PipelineGovernor','AdaptiveTransferSizer','EnableReplay')
          foreach ($token in $forbidden) {
            if ($all.Contains($token)) { throw "Legacy architecture remains in product code: $token" }
          }
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          if (-not $engine.Contains('new SharedBlock(lease, read, readBufferSize, active.Count, bufferBudget)')) { throw 'Shared refcount block path missing' }
          if (-not $engine.Contains('worker.Channel.Writer.TryWrite(message)')) { throw 'Single destination queue path missing' }
          if (-not $engine.Contains('Task.WhenAll(reads)')) { throw 'Coordinated verification path missing' }
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier
      - name: Remove migration infrastructure and commit green product
        shell: pwsh
        run: |
          if (Test-Path artifact) { Remove-Item artifact -Recurse -Force }
          git rm -f tools/extremecopy_baseline_migration.py tools/extremecopy_migration_hotfix.py .github/workflows/extremecopy-baseline-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'perf: rebuild copier around shared FAN-OUT pool'
          git push origin HEAD:main
