name: Remove write-through migration

on:
  push:
    paths:
      - '.github/workflows/remove-writethrough-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Remove per-write durability barrier
        shell: pwsh
        run: ./tools/patch-remove-writethrough.ps1
