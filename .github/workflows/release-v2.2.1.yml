name: Release v2.2.1

# One-time release workflow: runs when this file reaches main, publishes v2.2.1 and removes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2.2.1.yml'

permissions:
  contents: write

concurrency:
  group: release-v2.2.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Refuse to overwrite an existing release
        shell: pwsh
        run: |
          git fetch --tags
          if (git tag --list 'v2.2.1') { throw 'Tag v2.2.1 already exists.' }

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Publish self-contained win-x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier -p:SourceRevisionId=${{ github.sha }}

      - name: Verify version and embedded revision
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifact/RepartoCopier/RepartoCopier.WinUI.exe')) { throw 'Published executable missing.' }
          $assemblies = @(Get-ChildItem 'dotnet/RepartoCopier.WinUI/bin/Release' -Recurse -Filter 'RepartoCopier.WinUI.dll')
          if ($assemblies.Count -eq 0) { throw 'Built WinUI assembly not found.' }
          foreach ($assembly in $assemblies) {
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($assembly.FullName)
            if ($info.FileVersion -ne '2.2.1.0') { throw "Unexpected file version: $($info.FileVersion)" }
            if (-not $info.ProductVersion.EndsWith('+${{ github.sha }}', [StringComparison]::OrdinalIgnoreCase)) {
              throw "Unexpected product version: $($info.ProductVersion)"
            }
          }

      - name: Package release and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'RepartoCopier-v2.2.1-win-x64.zip'
          Compress-Archive -Path 'artifact/RepartoCopier/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          Copy-Item '.github/RELEASE_NOTES_v2.2.1.md' RELEASE_NOTES.md

      - name: Remove one-time release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/release-v2.2.1.yml' '.github/RELEASE_NOTES_v2.2.1.md'
          git commit -m 'release: v2.2.1'
          git push origin HEAD:main

      - name: Create v2.2.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          git tag -a v2.2.1 $sha -m 'RepartoCopier v2.2.1'
          git push origin v2.2.1
          gh release create v2.2.1 'RepartoCopier-v2.2.1-win-x64.zip' 'SHA256SUMS.txt' --title 'RepartoCopier v2.2.1' --notes-file RELEASE_NOTES.md --target $sha
