name: FAN-OUT data fast-path migration

on:
  push:
    paths:
      - '.github/workflows/fanout-data-fastpath-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Specialize FAN-OUT data delivery
        shell: pwsh
        run: ./tools/patch-fanout-data-fastpath.ps1
