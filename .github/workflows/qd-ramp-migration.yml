name: Adaptive QD ramp migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-qd-ramp.ps1'
      - '.github/workflows/qd-ramp-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply adaptive QD ramp migration
        shell: pwsh
        run: ./tools/patch-qd-ramp.ps1
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit product change and remove migration infrastructure
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/patch-qd-ramp.ps1 .github/workflows/qd-ramp-migration.yml
          git add dotnet/RepartoCopier.Core/DeviceScheduler.cs dotnet/RepartoCopier.Core.Tests/DeviceSchedulerTests.cs
          git commit -m "perf: accelerate adaptive QD exploration by physical queue window"
          git push
