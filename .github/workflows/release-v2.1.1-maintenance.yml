name: Release v2.1.1 and clean Actions history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2.1.1-maintenance.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-v2.1.1-maintenance
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare v2.1.1 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectPath = 'dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj'
          $project = Get-Content $projectPath -Raw
          $project = $project.Replace('<Version>2.1.0</Version>', '<Version>2.1.1</Version>')
          $project = $project.Replace('<AssemblyVersion>2.1.0.0</AssemblyVersion>', '<AssemblyVersion>2.1.1.0</AssemblyVersion>')
          $project = $project.Replace('<FileVersion>2.1.0.0</FileVersion>', '<FileVersion>2.1.1.0</FileVersion>')
          Set-Content -Path $projectPath -Value $project -Encoding utf8NoBOM

          $changelogPath = 'CHANGELOG.md'
          $changelog = Get-Content $changelogPath -Raw
          $marker = '## v2.1.0 — 2026-09-15'
          $idx = $changelog.IndexOf($marker, [System.StringComparison]::Ordinal)
          if ($idx -lt 0) { throw 'v2.1.0 marker not found in CHANGELOG.md' }
          $tail = $changelog.Substring($idx)
          $head = @'
          # Changelog

          ## Unreleased — main

          ## v2.1.1 — 2026-09-16

          - FAN-OUT productivo simplificado al modelo compartido: una lectura del origen, bloques de 8 MiB con refcount y pool activo de 256 MiB para todos los destinos.
          - Eliminadas del camino productivo las capas de replay, staging por rama, aislamiento por copia privada y exploración adaptativa de queue depth.
          - Escritura por destino alineada con el enfoque estable de ExtremeCopy: una operación física en vuelo por dispositivo, `SEQUENTIAL_SCAN`, `NO_BUFFERING` cuando es elegible y fallback buffered seguro; la ruta de destino ya no usa `OVERLAPPED`.
          - Recuperación de I/O transitorio sin el corte arbitrario de tres fallos consecutivos, manteniendo cancelación y fallo inmediato para errores no transitorios.
          - Verificación streaming con workspace fijo de 8 MiB: relee origen y destinos completados por el mismo offset, compara CRC32C inmediatamente y no conserva historial CRC durante COPY.
          - Retry/fallback de verificación convertido a flujo iterativo para evitar crecimiento recursivo de pila.
          - Progreso, velocidad y ETA de COPY usan el mismo avance lógico del destino más atrasado; VERIFY expone velocidad lógica y ETA independientes.
          - WinUI compactada con Compact Density oficial, `TitleBar` nativo, Mica, barra global gruesa, destinos horizontales autoajustados y verificación siempre activa sin toggle visible.
          - Ventana principal reducida y árbol visual aligerado; refresco de telemetría limitado a 4 Hz para minimizar trabajo del UI thread durante las copias.
          - Producto C#/.NET-only validado en Core Release, WinUI Release x64 y publicación self-contained.

          '@
          $head = ($head -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          Set-Content -Path $changelogPath -Value ($head + $tail) -Encoding utf8NoBOM

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Assert C#/.NET-only product sources
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Error "Legacy source remains: $_" }
            throw 'Repository must remain C#/.NET-only.'
          }

      - name: Publish self-contained win-x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier

      - name: Package release and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'RepartoCopier-v2.1.1-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'artifact/RepartoCopier/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Commit release metadata and remove one-time workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/release-v2.1.1-maintenance.yml'
          git add CHANGELOG.md dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj
          git commit -m 'release: v2.1.1'
          git push origin HEAD:main

      - name: Create v2.1.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          git tag -a v2.1.1 $sha -m 'RepartoCopier v2.1.1'
          git push origin v2.1.1
          $notes = @'
          ## RepartoCopier v2.1.1

          Esta versión consolida el motor FAN-OUT compartido inspirado en los invariantes útiles de ExtremeCopy, elimina complejidad innecesaria y compacta la experiencia WinUI.

          ### Motor
          - Pool FAN-OUT compartido de 256 MiB con bloques de 8 MiB y refcount.
          - Una lectura del origen alimenta todos los destinos.
          - QD1 por dispositivo y escritura secuencial estable; sin exploración adaptativa ni replay/staging productivo.
          - Direct I/O seguro con `NO_BUFFERING + SEQUENTIAL_SCAN` cuando aplica y fallback buffered.
          - Reintentos transitorios sin límite fijo de tres fallos.

          ### Verificación
          - Workspace fijo de 8 MiB.
          - Relectura streaming de origen + destinos completados y comparación CRC32C inmediata.
          - Sin historial CRC mantenido durante COPY.
          - Retry/fallback iterativo.

          ### WinUI
          - Compact Density oficial, `TitleBar` nativo y Mica.
          - Interfaz más pequeña y densa, destinos autoajustados y barra global gruesa.
          - Verificación siempre activa sin checkbox visible.
          - Refresco de telemetría a 4 Hz para reducir impacto del UI thread.

          ### Validación
          - Core Release completo.
          - WinUI Release x64.
          - Gate C#/.NET-only.
          - Publicación self-contained win-x64.
          - `SHA256SUMS.txt` incluido.
          '@
          $notes = ($notes -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $notes | Set-Content RELEASE_NOTES.md -Encoding utf8NoBOM
          gh release create v2.1.1 'RepartoCopier-v2.1.1-win-x64.zip' 'SHA256SUMS.txt' --title 'RepartoCopier v2.1.1' --notes-file RELEASE_NOTES.md --target $sha

      - name: Clean old GitHub Actions runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $current = [long]'${{ github.run_id }}'
          $runs = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | [.id,.created_at] | @tsv'
          $rows = @()
          foreach ($line in $runs) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split "`t"
            if ($parts.Count -lt 2) { continue }
            $rows += [pscustomobject]@{ Id = [long]$parts[0]; Created = [datetime]$parts[1] }
          }
          $keep = $rows | Where-Object { $_.Id -ne $current } | Sort-Object Created -Descending | Select-Object -First 25
          $keepIds = @($keep | ForEach-Object { $_.Id })
          $delete = $rows | Where-Object { $_.Id -ne $current -and $keepIds -notcontains $_.Id }
          Write-Host "Keeping $($keepIds.Count) recent completed runs; deleting $($delete.Count) older runs."
          foreach ($run in $delete) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.Id)" 2>$null
          }
