name: Fan-out admission refactor

# Rerun after tightening cancellation ownership tests.
on:
  push:
    branches: [main]
    paths:
      - '.github/fanout-refactor.py'
      - '.github/workflows/fanout-refactor.yml'

permissions:
  contents: write

concurrency:
  group: fanout-refactor-main
  cancel-in-progress: true

jobs:
  refactor-and-validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply fan-out refactor
        shell: pwsh
        run: python .github/fanout-refactor.py

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Assert no legacy FAN-OUT gates remain
        shell: pwsh
        run: |
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          foreach ($forbidden in @('WaitForAdaptiveWindowAsync', 'AdaptiveQueueLimit', 'ChannelCapacity = 16', 'Task.WhenAll(deliveries)')) {
            if ($engine.Contains($forbidden)) { throw "Legacy FAN-OUT gate remains: $forbidden" }
          }
          if (-not $engine.Contains('CreateUnbounded<FanoutMessage>')) { throw 'Destination channel is not unbounded.' }
          if (-not $engine.Contains('SingleWriter = true')) { throw 'Destination channel is not single-writer.' }
          if (-not $engine.Contains('GlobalControlBacklogBudget')) { throw 'Global control backlog budget is not wired.' }

      - name: Commit validated refactor and clean staging files
        shell: pwsh
        run: |
          Remove-Item .github/fanout-refactor.py -Force
          Remove-Item .github/workflows/fanout-refactor.yml -Force
          git config user.name "ReinierTutoriales"
          git config user.email "86568548+ReinierTutoriales@users.noreply.github.com"
          git add -A
          git commit -m "perf: decouple fan-out admission from slow destinations"
          git push origin HEAD:main
