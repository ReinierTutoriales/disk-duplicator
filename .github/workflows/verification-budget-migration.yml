name: Verification budget migration

on:
  push:
    paths:
      - '.github/workflows/verification-budget-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Integrate global verification byte budget
        shell: pwsh
        run: ./tools/patch-verification-budget.ps1
