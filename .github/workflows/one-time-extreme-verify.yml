name: One-time Extreme-style verification optimizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-extreme-verify.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Fix optimizer patch matching
        run: python tools/fix_extreme_verify_patcher.py

      - name: Apply Extreme-style verification optimizer
        run: python tools/apply_extreme_verify.py

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit optimized automatic verification
        shell: pwsh
        run: |
          git config user.name "ReinierTutoriales"
          git config user.email "86568548+ReinierTutoriales@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core dotnet/RepartoCopier.Core.Tests dotnet/RepartoCopier.WinUI/MainWindow.xaml dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs
          if (git diff --cached --quiet) { throw 'No product changes were produced.' }
          git commit -m "perf(core): make CRC32 overlapped verification automatic"
          git push origin HEAD:main
