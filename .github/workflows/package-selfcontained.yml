name: Package self-contained Windows build

on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - '.github/workflows/package-selfcontained.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and test core
        run: |
          dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
          dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Publish fully self-contained x64 build
        run: |
          dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
          dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish-selfcontained

      - name: Assert bundled .NET runtime and executable
        shell: pwsh
        run: |
          $required = @(
            'publish-selfcontained/RepartoCopier.WinUI.exe',
            'publish-selfcontained/coreclr.dll',
            'publish-selfcontained/hostfxr.dll',
            'publish-selfcontained/hostpolicy.dll'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required self-contained file: $path" }
          }

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish-selfcontained/* -DestinationPath RepartoCopier-fastpath-selfcontained-win-x64.zip -Force
          Get-FileHash RepartoCopier-fastpath-selfcontained-win-x64.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: RepartoCopier-fastpath-selfcontained-win-x64
          path: RepartoCopier-fastpath-selfcontained-win-x64.zip
          retention-days: 14
