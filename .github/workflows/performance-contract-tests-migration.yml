name: Performance contract tests migration

on:
  push:
    paths:
      - '.github/workflows/performance-contract-tests-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Migrate obsolete performance contracts
        shell: pwsh
        run: ./tools/patch-performance-contract-tests.ps1
