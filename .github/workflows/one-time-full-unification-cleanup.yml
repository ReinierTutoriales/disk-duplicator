name: One-time full unification cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-full-unification-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply full unification cleanup
        run: |
          python tools/fix_full_unification.py
          python tools/add_unification_gate.py
      - name: Verify removed symbols have no product declarations
        shell: pwsh
        run: |
          $patterns = @('class SessionStore','record StorageDeviceProfile','NoteQueuedBytes\(','NoteDequeuedBytes\(','AppendDurable\(','ClearCacheForTests\(')
          foreach ($pattern in $patterns) {
            $hits = Get-ChildItem dotnet/RepartoCopier.Core -Recurse -Filter *.cs | Select-String -Pattern $pattern
            if ($hits) {
              $hits | ForEach-Object { Write-Host $_.Line }
              throw "Superseded product symbol still exists: $pattern"
            }
          }
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit unified product
        shell: pwsh
        run: |
          git config user.name "ReinierTutoriales"
          git config user.email "86568548+ReinierTutoriales@users.noreply.github.com"
          git add README.md CHANGELOG.md TESTING.md docs/FANOUT-PERFORMANCE-ROADMAP.md dotnet/RepartoCopier.Core dotnet/RepartoCopier.Core.Tests
          if (git diff --cached --quiet) { throw 'No unification changes were produced.' }
          git commit -m "refactor(core): unify active architecture and remove dead paths"
          git push origin HEAD:main
