name: Fix .NET migration compile

on:
  push:
    branches: [main]
    paths:
      - '.github/fix_dotnet_compile.py'
      - '.github/workflows/fix-dotnet-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-dotnet-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-integrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply compile fixes
        run: python .github/fix_dotnet_compile.py
      - name: Restore tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit validated fix and clean helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .github/fix_dotnet_compile.py
          Remove-Item .github/workflows/fix-dotnet-compile.yml
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs .github/fix_dotnet_compile.py .github/workflows/fix-dotnet-compile.yml
          git commit -m "fix: stabilize initial C# FAN-OUT migration"
          git push origin HEAD:main
