name: Adaptive memory budget

on:
  push:
    branches: [main]
    paths:
      - '.github/apply_adaptive_memory_budget.py'
      - '.github/workflows/adaptive-memory-budget.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-memory-budget
  cancel-in-progress: true

jobs:
  validate-and-integrate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply adaptive memory budget
        run: python .github/apply_adaptive_memory_budget.py
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit validated adaptive budget
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs
          if (git diff --cached --quiet) { throw 'No adaptive memory changes produced.' }
          git commit -m "perf: adapt FAN-OUT memory budget to Windows RAM"
          git push origin HEAD:main
