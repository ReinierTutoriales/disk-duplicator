name: Final clean main architecture gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-clean-main-gate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Pin latest main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git diff --check
      - name: Assert clean productive repository shape
        shell: pwsh
        run: |
          $patches = @(git ls-files 'tools/patch-*.ps1')
          if ($patches.Count -gt 0) {
            $patches | ForEach-Object { Write-Error "Temporary patch remains: $_" }
            throw 'Temporary migration patch remains in main.'
          }
          $workflows = @(git ls-files '.github/workflows/*.yml')
          $allowed = @(
            '.github/workflows/windows-dotnet.yml',
            '.github/workflows/final-clean-main-gate.yml'
          )
          $unexpected = @($workflows | Where-Object { $allowed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Error "Unexpected temporary workflow remains: $_" }
            throw 'Temporary workflows remain in main.'
          }
      - name: Restore solution
        shell: pwsh
        run: dotnet restore RepartoCopier.sln
      - name: Core tests Release
        shell: pwsh
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        shell: pwsh
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        shell: pwsh
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Assert CSharp NET only product sources
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
          if ($forbidden.Count -gt 0) { throw 'Repository must remain C#/.NET-only.' }
      - name: Architecture source contracts
        shell: pwsh
        run: |
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          if ($engine -notmatch 'TransientIoErrorClassifier\.IsTransient') { throw 'Transient classifier lost its productive consumer.' }
          if ($engine -notmatch 'BranchReplayPlacement\.ResolveSafeDirectory') { throw 'Replay placement lost its productive consumer.' }
          if ($engine -notmatch 'ReplayGate\.ShouldReplay') { throw 'Replay hysteresis gate lost its productive consumer.' }
          $ui = Get-Content dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs -Raw
          if ($ui -notmatch 'SpeedMetricText\.Text = paused \? "0\.0 B/s"') { throw 'Paused UI throughput contract missing.' }
      - name: Publish self contained win x64
        shell: pwsh
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier
      - name: Upload final validation build
        uses: actions/upload-artifact@v6
        with:
          name: RepartoCopier-final-audited-win-x64
          path: artifact/RepartoCopier/RepartoCopier.WinUI.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove final gate from main
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          git rm .github/workflows/final-clean-main-gate.yml
          git diff --cached --check
          git commit -m "chore: remove final architecture gate"
          git pull --rebase origin main
          git push origin main
