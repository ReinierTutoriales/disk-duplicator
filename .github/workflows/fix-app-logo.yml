name: Fix AppLogo PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-app-logo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Regenerate PNG from valid ICO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $icoPath = Resolve-Path 'dotnet/RepartoCopier.WinUI/Assets/AppLogo.ico'
          $pngPath = Join-Path (Split-Path $icoPath) 'AppLogo.png'

          $icon = New-Object System.Drawing.Icon($icoPath, 256, 256)
          try {
            $source = $icon.ToBitmap()
            try {
              $bitmap = New-Object System.Drawing.Bitmap(256, 256, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              try {
                $g = [System.Drawing.Graphics]::FromImage($bitmap)
                try {
                  $g.Clear([System.Drawing.Color]::Transparent)
                  $g.DrawImage($source, 0, 0, 256, 256)
                } finally { $g.Dispose() }

                # Remove only exact opaque black connected to an outer edge.
                # This preserves any intentional black pixels isolated inside the logo.
                $queue = [System.Collections.Generic.Queue[System.Drawing.Point]]::new()
                $seen = New-Object 'bool[,]' 256,256
                function Try-Enqueue([int]$x, [int]$y) {
                  if ($x -lt 0 -or $x -ge 256 -or $y -lt 0 -or $y -ge 256) { return }
                  if ($seen[$x,$y]) { return }
                  $seen[$x,$y] = $true
                  $c = $bitmap.GetPixel($x,$y)
                  if ($c.A -eq 255 -and $c.R -eq 0 -and $c.G -eq 0 -and $c.B -eq 0) {
                    $queue.Enqueue([System.Drawing.Point]::new($x,$y))
                  }
                }
                for ($i = 0; $i -lt 256; $i++) {
                  Try-Enqueue $i 0; Try-Enqueue $i 255; Try-Enqueue 0 $i; Try-Enqueue 255 $i
                }
                $transparent = [System.Drawing.Color]::FromArgb(0,0,0,0)
                while ($queue.Count -gt 0) {
                  $p = $queue.Dequeue()
                  $bitmap.SetPixel($p.X,$p.Y,$transparent)
                  Try-Enqueue ($p.X-1) $p.Y
                  Try-Enqueue ($p.X+1) $p.Y
                  Try-Enqueue $p.X ($p.Y-1)
                  Try-Enqueue $p.X ($p.Y+1)
                }

                $bitmap.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $bitmap.Dispose() }
            } finally { $source.Dispose() }
          } finally { $icon.Dispose() }
      - name: Validate PNG structure and transparency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $path = Resolve-Path 'dotnet/RepartoCopier.WinUI/Assets/AppLogo.png'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 1000) { throw 'PNG unexpectedly small.' }
          $signature = [byte[]](137,80,78,71,13,10,26,10)
          for ($i=0; $i -lt 8; $i++) { if ($bytes[$i] -ne $signature[$i]) { throw 'Invalid PNG signature.' } }
          $tail = [System.Text.Encoding]::ASCII.GetString($bytes, $bytes.Length - 12, 12)
          if ($tail -notmatch 'IEND') { throw 'PNG missing terminal IEND chunk.' }
          $bmp = [System.Drawing.Bitmap]::FromFile($path)
          try {
            if ($bmp.Width -ne 256 -or $bmp.Height -ne 256) { throw "Unexpected dimensions: $($bmp.Width)x$($bmp.Height)" }
            foreach ($p in @(@(0,0), @(255,0), @(0,255), @(255,255))) {
              if ($bmp.GetPixel($p[0],$p[1]).A -ne 0) { throw "Corner $($p[0]),$($p[1]) is not transparent." }
            }
          } finally { $bmp.Dispose() }
      - name: Commit regenerated binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.WinUI/Assets/AppLogo.png
          git diff --cached --check
          if (-not (git diff --cached --name-only | Select-String -SimpleMatch 'dotnet/RepartoCopier.WinUI/Assets/AppLogo.png')) { throw 'AppLogo.png was not staged.' }
          git commit -m "fix: regenerate valid transparent AppLogo PNG"
          git pull --rebase origin main
          git push origin main
