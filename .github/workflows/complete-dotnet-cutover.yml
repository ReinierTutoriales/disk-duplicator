name: Complete C# WinUI cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-dotnet-cutover.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-dotnet-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-cutover:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Complete recovery wiring
        shell: pwsh
        run: |
          python .github/integrate_dotnet_recovery.py

          $engine = 'dotnet/RepartoCopier.Core/CopyEngine.cs'
          $text = Get-Content $engine -Raw
          $old = 'RecoveryManager.PrepareAndNormalize(root, recoveryFiles)'
          $new = 'RecoveryManager.PrepareAndNormalize(sourceRoot, root, recoveryFiles)'
          if (-not $text.Contains($old)) { throw 'Recovery integration anchor not found.' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $engine -Value $text -Encoding utf8NoBOM

          $recovery = 'dotnet/RepartoCopier.Core/Recovery.cs'
          $text = Get-Content $recovery -Raw
          $text = $text.Replace('Rust ignores malformed manifest entries for resume trust.', 'Malformed manifest entries are never trusted for resume.')
          Set-Content -Path $recovery -Value $text -Encoding utf8NoBOM

          $tests = 'dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs'
          $text = Get-Content $tests -Raw
          $text = $text.Replace('RecoveryWritesRustCompatibleJournalAndManifest', 'RecoveryWritesLegacyCompatibleJournalAndManifest')
          $text = $text.Replace('RecoveryAcceptsOnlyPhysicallyVerifiedRustState', 'RecoveryAcceptsOnlyPhysicallyVerifiedLegacyState')
          $text = $text.Replace('WriteRustRecoveryProof', 'WriteLegacyRecoveryProof')
          Set-Content -Path $tests -Value $text -Encoding utf8NoBOM

      - name: Remove legacy Rust implementation
        shell: pwsh
        run: |
          git rm -r --ignore-unmatch .cargo src Cargo.toml Cargo.lock build.rs app.manifest
          git rm --ignore-unmatch .github/workflows/build.yml
          git rm --ignore-unmatch .github/workflows/dotnet-migration.yml
          git rm --ignore-unmatch .github/workflows/integrate-dotnet-recovery.yml
          git rm --ignore-unmatch .github/integrate_dotnet_recovery.py

      - name: Write .NET-only repository metadata
        shell: pwsh
        run: |
          @'
          # RepartoCopier

          RepartoCopier es una aplicación de escritorio para Windows que copia un origen hacia múltiples destinos simultáneamente mediante FAN-OUT, preservando la estructura completa de carpetas y priorizando integridad, recuperación y comportamiento nativo del sistema operativo.

          ## Plataforma

          - C# y .NET 10
          - WinUI 3 + XAML
          - Windows App SDK 2.4
          - Windows 10 2004 (19041) o posterior
          - x64

          ## Arquitectura

          `RepartoCopier.WinUI` contiene exclusivamente la interfaz Windows. Usa controles WinUI, recursos de tema/acento, escalado DPI del sistema, focus/teclado y pickers nativos. No se implementan sustitutos visuales manuales cuando Windows ya ofrece el comportamiento.

          `RepartoCopier.Core` contiene planificación, preflight, FAN-OUT, verificación BLAKE3, recuperación transaccional y protección de rutas. Las llamadas Win32 se mantienen aisladas y solo se usan cuando .NET o Windows App SDK no exponen la semántica requerida.

          ## Invariantes de copia

          - FAN-OUT es el único modo de copia.
          - Una carpeta seleccionada se replica incluyendo su carpeta raíz.
          - Se conserva exactamente la estructura de directorios, incluidas carpetas vacías.
          - Un archivo seleccionado copia únicamente ese archivo.
          - Los archivos adicionales del destino no se eliminan.
          - El estado interno vive fuera del árbol copiado en `.disk-duplicator-state`.
          - Los destinos se verifican físicamente antes de confiar en recovery/skip.
          - Symlinks, junctions, reparse points y solapamientos peligrosos se rechazan de forma fail-closed.

          ## Compilar

          ```powershell
          dotnet restore RepartoCopier.sln
          dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release
          dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64
          ```

          La versión estable histórica v1.4.3 permanece publicada sin modificaciones. El corte C#/WinUI corresponde a una versión futura.
          '@ | Set-Content README.md -Encoding utf8NoBOM

          @'
          # Testing

          El producto actual es exclusivamente C#/.NET/WinUI 3.

          ## Gate obligatorio

          ```powershell
          dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
          dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
          dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
          dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
          ```

          ## Cobertura mínima de regresión

          - Árbol de carpetas completo y carpetas vacías.
          - Archivo individual sin copiar hermanos.
          - FAN-OUT multibloque hacia varios destinos.
          - Unicode y rutas Windows.
          - Solapamientos origen/destinos y destino/destino.
          - Conflictos archivo/carpeta y reparse points.
          - Cálculo de espacio con reserva y granularidad de asignación.
          - Recovery: journal, manifest, backup, corrupción, estado legacy y validación BLAKE3 física.
          - Pausa, continuación, cancelación y fallo aislado por destino.

          ## Pruebas físicas antes de release

          Ejecutar en Windows real con USB, SATA SSD y NVMe cuando estén disponibles; 1/2/4/8/16 destinos; archivos grandes y árboles de archivos pequeños; desconexión de destino; cancelación durante lectura/escritura/commit; paths Unicode y UNC.
          '@ | Set-Content TESTING.md -Encoding utf8NoBOM

          @'
          .vs/
          **/bin/
          **/obj/
          AppPackages/
          *.msix
          *.msixbundle
          *.appx
          *.appxbundle
          *.cer
          TestResults/
          '@ | Set-Content .gitignore -Encoding utf8NoBOM

      - name: Add permanent Windows .NET CI
        shell: pwsh
        run: |
          @'
          name: Windows .NET CI

          on:
            push:
              branches: [main]
              paths:
                - 'dotnet/**'
                - 'RepartoCopier.sln'
                - '.github/workflows/windows-dotnet.yml'
                - 'README.md'
                - 'TESTING.md'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: windows-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v7.0.1
                - uses: actions/setup-dotnet@v5
                  with:
                    dotnet-version: '10.0.x'
                - name: Restore core tests
                  run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
                - name: Test core Release
                  run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
                - name: Restore WinUI
                  run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
                - name: Build WinUI Release
                  run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
                - name: Assert .NET-only tracked sources
                  shell: pwsh
                  run: |
                    $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
                    if ($forbidden.Count -gt 0) {
                      $forbidden | ForEach-Object { Write-Error "Legacy source remains: $_" }
                      throw 'Repository must remain C#/.NET-only.'
                    }
          '@ | Set-Content .github/workflows/windows-dotnet.yml -Encoding utf8NoBOM

      - name: Assert no Rust sources remain
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Error "Legacy source remains: $_" }
            throw 'Rust artifacts still tracked.'
          }

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit validated C# WinUI cutover
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/complete-dotnet-cutover.yml
          git add -A
          git commit -m "refactor: complete C# WinUI migration"
          git push origin HEAD:main
