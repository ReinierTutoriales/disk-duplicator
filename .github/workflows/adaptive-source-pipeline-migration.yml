name: Adaptive source pipeline migration

on:
  push:
    paths:
      - '.github/workflows/adaptive-source-pipeline-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Apply adaptive source safety follow-up
        shell: pwsh
        run: ./tools/patch-adaptive-source-followup.ps1
