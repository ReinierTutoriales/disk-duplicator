name: Branch pending-byte accounting migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-branch-pending-bytes.ps1'
      - '.github/workflows/branch-pending-bytes-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply branch pending-byte accounting migration
        shell: pwsh
        run: ./tools/patch-branch-pending-bytes.ps1
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit product change and remove migration infrastructure
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core.Tests/UnificationContractTests.cs
          git rm tools/patch-branch-pending-bytes.ps1 .github/workflows/branch-pending-bytes-migration.yml
          git commit -m "perf: track branch payload until shared reference release"
          git pull --rebase origin main
          git push origin HEAD:main
