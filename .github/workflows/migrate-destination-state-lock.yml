name: Destination state lock architecture fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-destination-state-lock-v2.ps1'
      - '.github/workflows/migrate-destination-state-lock.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Rebase on latest main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: Restore solution
        shell: pwsh
        run: dotnet restore RepartoCopier.sln
      - name: Apply corrected destination state lock patch
        shell: pwsh
        run: ./tools/patch-destination-state-lock-v2.ps1
      - name: Core tests Release
        shell: pwsh
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        shell: pwsh
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        shell: pwsh
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Assert CSharp NET only product sources
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|\.rs$|^\.cargo/' })
          if ($forbidden.Count -gt 0) { throw 'Repository must remain C#/.NET-only.' }
      - name: Publish self contained win x64
        shell: pwsh
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier
      - name: Upload validation build
        uses: actions/upload-artifact@v6
        with:
          name: RepartoCopier-destination-state-lock-v2-win-x64
          path: artifact/RepartoCopier/RepartoCopier.WinUI.exe
          if-no-files-found: error
          retention-days: 14
      - name: Commit productive fix
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          git rm tools/patch-destination-state-lock-v2.ps1
          git add -A
          git diff --cached --check
          $required = @(
            'dotnet/RepartoCopier.Core/DestinationStateLease.cs',
            'dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs'
          )
          $staged = @(git diff --cached --name-only)
          foreach ($path in $required) { if ($staged -notcontains $path) { throw "Required productive change was not staged: $path" } }
          git commit -m "fix: preserve state migration while holding destination lock"
          git pull --rebase origin main
          git push origin main
