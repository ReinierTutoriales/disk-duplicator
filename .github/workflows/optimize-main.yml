name: optimize-main-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Optimize fan-out scheduler
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("src/engine.rs")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              'const SEND_POLL: Duration = Duration::from_millis(150);',
              'const SEND_POLL: Duration = Duration::from_millis(10);'
          )

          old_try = '''fn try_deliver_once(tx: &mpsc::Sender<FanoutItem>, item: FanoutItem, control: &DestControl) -> SendOutcome {
    match tx.send_timeout(item, SEND_POLL) {
        Ok(()) => { control.mark_progress(); SendOutcome::Ok }
        Err(crossbeam_channel::SendTimeoutError::Timeout(_)) => SendOutcome::Timeout,
        Err(crossbeam_channel::SendTimeoutError::Disconnected(_)) => SendOutcome::Dead,
    }
}'''
          new_try = '''fn try_deliver_once(tx: &mpsc::Sender<FanoutItem>, item: FanoutItem, control: &DestControl) -> SendOutcome {
    // El productor nunca espera 150 ms por un destino. Una entrega es una
    // operación no bloqueante; la espera corta ocurre entre rondas y no
    // pertenece a ningún destino concreto.
    match tx.try_send(item) {
        Ok(()) => { control.mark_progress(); SendOutcome::Ok }
        Err(crossbeam_channel::TrySendError::Full(_)) => SendOutcome::Timeout,
        Err(crossbeam_channel::TrySendError::Disconnected(_)) => SendOutcome::Dead,
    }
}'''
          if old_try not in s:
              raise SystemExit("try_deliver_once block not found")
          s = s.replace(old_try, new_try)

          pattern = re.compile(r"fn deliver_to_active\(.*?\n\}\n\nfn mark_skipped_all", re.S)
          replacement = '''fn deliver_to_active(
    active: &mut Vec<usize>,
    senders: &[Option<mpsc::Sender<FanoutItem>>],
    controls: &[Arc<DestControl>],
    state: &JobState,
    counts_data: bool,
    make_item: impl Fn() -> FanoutItem,
) {
    // Round-robin real: un destino lleno no bloquea la entrega a los demás.
    // Solo dormimos una pequeña cantidad cuando TODA la ronda quedó llena.
    let mut pending = active.clone();
    while !pending.is_empty() {
        if !wait_pause(state) { active.clear(); return; }
        let mut still_pending = Vec::with_capacity(pending.len());
        let mut delivered_any = false;

        for slot in pending {
            if !controls[slot].alive.load(Ordering::Acquire) { continue; }
            let Some(tx) = senders[slot].as_ref() else { continue };
            if counts_data { controls[slot].queue_depth.fetch_add(1, Ordering::AcqRel); }

            match try_deliver_once(tx, make_item(), &controls[slot]) {
                SendOutcome::Ok => delivered_any = true,
                SendOutcome::Timeout => {
                    if counts_data { controls[slot].queue_depth.fetch_sub(1, Ordering::AcqRel); }
                    if controls[slot].stalled_for() >= STALL_THRESHOLD {
                        controls[slot].alive.store(false, Ordering::Release);
                        active.retain(|&s| s != slot);
                    } else {
                        still_pending.push(slot);
                    }
                }
                SendOutcome::Dead => {
                    if counts_data { controls[slot].queue_depth.fetch_sub(1, Ordering::AcqRel); }
                    controls[slot].alive.store(false, Ordering::Release);
                    active.retain(|&s| s != slot);
                }
            }
        }

        if !delivered_any && !still_pending.is_empty() {
            thread::sleep(SEND_POLL);
        }
        pending = still_pending;
    }
}

fn mark_skipped_all'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit("deliver_to_active block not found")
          p.write_text(s2, encoding="utf-8")

      - name: Test and check
        run: cargo test && cargo check

      - name: Commit optimized main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.rs
          git diff --cached --quiet && exit 0
          git commit -m "perf: aislar destinos lentos con scheduler no bloqueante"
          git push origin HEAD:main
