name: Copy performance unblock migration

on:
  push:
    paths:
      - '.github/workflows/unblock-copy-performance.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Remove fixed copy-path performance thresholds
        shell: pwsh
        run: ./tools/patch-unblock-copy-performance.ps1
