name: Multi-block integrity gate fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiblock-integrity-gate-fix.yml'
      - 'tools/patch-multiblock-integrity-gate.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply integrity gate fix
        shell: pwsh
        run: ./tools/patch-multiblock-integrity-gate.ps1

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release

      - name: Commit fix and remove migration infrastructure
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/CopyEngine.cs
          git rm tools/patch-multiblock-integrity-gate.ps1 .github/workflows/multiblock-integrity-gate-fix.yml
          git commit -m "fix: require scheduled and completed destination bytes"
          git push origin HEAD:main
