name: Control data decoupling migration

on:
  push:
    paths:
      - '.github/workflows/control-data-decoupling-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Decouple payload data from control backlog
        shell: pwsh
        run: ./tools/patch-control-data-decoupling.ps1
