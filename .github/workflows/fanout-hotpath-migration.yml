name: FAN-OUT hot-path migration

on:
  push:
    paths:
      - '.github/workflows/fanout-hotpath-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Simplify FAN-OUT hot path
        shell: pwsh
        run: ./tools/patch-fanout-hotpath.ps1
