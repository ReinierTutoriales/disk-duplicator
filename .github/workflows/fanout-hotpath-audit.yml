name: FAN-OUT hot-path audit

on:
  push:
    paths:
      - '.github/workflows/fanout-hotpath-audit.yml'

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Audit obsolete FAN-OUT hot-path symbols
        shell: pwsh
        run: ./tools/audit-fanout-hotpath.ps1
