name: Build RepartoCopier Windows Executable
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install Rust 1.98.1
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
        targets: x86_64-pc-windows-msvc
        components: clippy
    - name: Sync release lockfile
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        cargo update -w
        git diff --quiet -- Cargo.lock
        if ($LASTEXITCODE -ne 0) {
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock for v1.4.1"
          git push origin HEAD:main
        }
    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test release
      run: cargo test --locked --release --verbose
    - name: Build release
      run: cargo build --locked --release --verbose
    - name: Upload executable
      uses: actions/upload-artifact@v7.0.1
      with:
        name: RepartoCopier
        path: target/release/RepartoCopier.exe
    - name: Publish GitHub release when version is new
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
        if (-not $match) { throw 'No se pudo leer la versión de Cargo.toml' }
        $version = $match.Matches[0].Groups[1].Value
        $tag = "v$version"

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "La release $tag ya existe; no se recrea."
          exit 0
        }

        @"
        ## RepartoCopier $tag

        Esta versión se centra en reforzar la integridad, la recuperación y la cancelación segura de trabajos.

        ### Mejoras principales
        - Cancelación más segura: el trabajo no se considera terminado mientras queden workers activos.
        - Estado de reanudación endurecido: una entrada completada requiere evidencia BLAKE3 válida.
        - Persistencia más segura entre manifest y journal para reducir inconsistencias tras interrupciones.
        - Validación física del tamaño de archivos temporales antes del commit final.
        - Verificación adicional del origen para detectar cambios de contenido incluso si tamaño y fecha se conservan.
        - Recuperación y limpieza de archivos temporales y backups reforzada.
        - Identificadores internos ampliados y manejo de rutas endurecido en Windows.
        - Versión del manifest de Windows sincronizada automáticamente con Cargo.
        - Nuevas pruebas adversariales para recuperación, corrupción de estado y cancelación.

        ### Plataforma
        - Windows 10/11 x64
        - Ejecutable autónomo: `RepartoCopier.exe`
        "@ | Set-Content -Path release-notes.md -Encoding utf8

        $releaseTarget = (git rev-parse HEAD).Trim()
        gh release create $tag target/release/RepartoCopier.exe `
          --target $releaseTarget `
          --title "RepartoCopier $tag" `
          --notes-file release-notes.md

  stable-compat:
    name: Stable compatibility (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        components: clippy
    - name: Sync workspace lockfile
      run: cargo update -w
    - name: Cache Rust stable build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: stable-compat
    - name: Clippy on latest stable
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test release on latest stable
      run: cargo test --locked --release --verbose
