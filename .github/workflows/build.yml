name: Build RepartoCopier Windows Executable
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: repartocopier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install Rust 1.98.1
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
        targets: x86_64-pc-windows-msvc
        components: clippy
    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test release
      run: cargo test --locked --release --verbose
    - name: Build release
      run: cargo build --locked --release --verbose
    - name: Upload executable
      uses: actions/upload-artifact@v7.0.1
      with:
        name: RepartoCopier
        path: target/release/RepartoCopier.exe
    - name: Publish GitHub release when version is new
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
        if (-not $match) { throw 'No se pudo leer la versión de Cargo.toml' }
        $version = $match.Matches[0].Groups[1].Value
        $tag = "v$version"

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "La release $tag ya existe; no se recrea."
          exit 0
        }

        @"
        ## RepartoCopier $tag

        FAN-OUT nativo: una carpeta origen, múltiples destinos y una sola lectura compartida por bloque.

        ### Novedades principales
        - FAN-OUT como único motor de copia, optimizado para múltiples destinos simultáneos.
        - Conserva exactamente la carpeta raíz seleccionada, toda la jerarquía y las carpetas vacías.
        - Verificación BLAKE3 del contenido y validación final de cada destino.
        - I/O nativo OVERLAPPED en Windows para lectura y escritura, con cancelación segura.
        - Reanudación robusta mediante journal y manifest fuera del árbol copiado.
        - Watchdog de lectura, escritura, sincronización y verificación para detectar destinos atascados.
        - Protección reforzada frente a symlinks, junctions y reparse points durante preflight y ejecución.
        - Estado temporal y commits endurecidos para evitar carreras entre destinos y rutas reemplazadas.
        - Backpressure por destino, reutilización de buffers y presupuesto global de memoria controlado.
        - Mejoras de estabilidad en cancelación, recuperación de escrituras parciales y commits críticos.

        ### Validación
        - Clippy con warnings tratados como errores.
        - Tests release en Rust 1.98.1.
        - Tests release en latest stable.
        - Build release Windows x64.

        ### Plataforma
        - Windows 10/11 x64
        - Ejecutable autónomo: `RepartoCopier.exe`
        "@ | Set-Content -Path release-notes.md -Encoding utf8

        gh release create $tag target/release/RepartoCopier.exe `
          --target "$env:GITHUB_SHA" `
          --title "RepartoCopier $tag" `
          --notes-file release-notes.md

  stable-compat:
    name: Stable compatibility (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        components: clippy
    - name: Cache Rust stable build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: stable-compat
    - name: Clippy on latest stable
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test release on latest stable
      run: cargo test --locked --release --verbose
