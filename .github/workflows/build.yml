name: Build RepartoCopier Windows Executable
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        components: clippy
    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Synchronize Cargo.lock
      id: lockfile
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        cargo check --quiet
        if (git diff --quiet -- Cargo.lock) {
          Write-Host "Cargo.lock ya está sincronizado."
          "changed=false" >> $env:GITHUB_OUTPUT
          exit 0
        }
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Cargo.lock
        git commit -m "chore: sync Cargo.lock for v1.3.0"
        git push origin HEAD:main
        "changed=true" >> $env:GITHUB_OUTPUT
    - name: Stop after lockfile synchronization
      if: steps.lockfile.outputs.changed == 'true'
      shell: pwsh
      run: |
        Write-Host "Cargo.lock fue actualizado en main. La nueva corrida validará el commit sincronizado."
    - name: Clippy
      if: steps.lockfile.outputs.changed != 'true'
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test release
      if: steps.lockfile.outputs.changed != 'true'
      run: cargo test --locked --release --verbose
    - name: Build release
      if: steps.lockfile.outputs.changed != 'true'
      run: cargo build --locked --release --verbose
    - name: Upload executable
      if: steps.lockfile.outputs.changed != 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: RepartoCopier
        path: target/release/RepartoCopier.exe
    - name: Publish GitHub release when version is new
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lockfile.outputs.changed != 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
        if (-not $match) { throw 'No se pudo leer la versión de Cargo.toml' }
        $version = $match.Matches[0].Groups[1].Value
        $tag = "v$version"

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "La release $tag ya existe; no se recrea."
          exit 0
        }

        @"
        ## RepartoCopier $tag

        RepartoCopier para Windows.

        ### Características principales
        - Copia FAN-OUT: un origen hacia múltiples destinos.
        - Conserva estructura de carpetas y directorios vacíos.
        - Verificación opcional BLAKE3.
        - Reanudación segura con estado fuera del árbol copiado.
        - Detección y aislamiento de destinos atascados.
        - Interfaz con tema claro/oscuro automático de Windows.
        - Progreso, velocidad, tiempo restante, colas y estado por destino.
        - Pluralización correcta y textos de interfaz refinados en español.

        ### Plataforma
        - Windows x64
        - Ejecutable autónomo: `RepartoCopier.exe`
        "@ | Set-Content -Path release-notes.md -Encoding utf8

        gh release create $tag target/release/RepartoCopier.exe `
          --target "$env:GITHUB_SHA" `
          --title "RepartoCopier $tag" `
          --notes-file release-notes.md
