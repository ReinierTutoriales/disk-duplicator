name: Optimize production fast path

on:
  push:
    branches: [main]
    paths:
      - '.github/optimize-fastpath.py'
      - '.github/workflows/optimize-fastpath.yml'

permissions:
  contents: write

concurrency:
  group: optimize-fastpath-main
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply production fast-path optimization
        shell: pwsh
        run: python .github/optimize-fastpath.py

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Assert production fast path
        shell: pwsh
        run: |
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          $models = Get-Content dotnet/RepartoCopier.Core/Models.cs -Raw
          $ui = Get-Content dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs -Raw
          if (-not $engine.Contains('SourceHashPipelineCapacity = 2')) { throw 'Source read/hash overlap pipeline is missing.' }
          if (-not $engine.Contains('ReadSourceAheadAsync')) { throw 'Read-ahead stage is missing.' }
          if ($engine.Contains('ConcurrentDictionary<string, byte[]> expectedHashes')) { throw 'Redundant concurrent expected-hash path remains.' }
          if (-not $models.Contains('bool Verify = false')) { throw 'Production Verify default is not false.' }
          if (-not $ui.Contains('Verify: false')) { throw 'WinUI still enables physical verification.' }
          if ($ui.Contains('Copia completada y verificada')) { throw 'UI still claims mandatory verification.' }

      - name: Publish corrected test build
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force publish-fast -ErrorAction SilentlyContinue
          dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore -o publish-fast
          if (-not (Test-Path publish-fast/RepartoCopier.WinUI.exe)) { throw 'Published executable is missing.' }
          Compress-Archive -Path publish-fast/* -DestinationPath RepartoCopier-fastpath-win-x64.zip -Force

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: RepartoCopier-fastpath-win-x64
          path: RepartoCopier-fastpath-win-x64.zip
          retention-days: 14
          if-no-files-found: error

      - name: Commit validated optimization and clean staging files
        shell: pwsh
        run: |
          Remove-Item .github/optimize-fastpath.py -Force
          Remove-Item .github/workflows/optimize-fastpath.yml -Force
          git config user.name "ReinierTutoriales"
          git config user.email "86568548+ReinierTutoriales@users.noreply.github.com"
          git add -A
          git commit -m "perf: optimize production copy fast path"
          git push origin HEAD:main
