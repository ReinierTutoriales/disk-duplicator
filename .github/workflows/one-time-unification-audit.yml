name: One-time full unification audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-unification-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Static unification scan
        run: python tools/audit_unification.py
      - name: Trace suspicious symbols exactly
        shell: pwsh
        run: |
          $symbols = @(
            'StorageDeviceProfile',
            'SessionStore',
            'WithDefaultExtension',
            'NoteQueuedBytes',
            'NoteDequeuedBytes',
            'AppendDurable',
            'ClearCacheForTests',
            'DiagnosticsSnapshot'
          )
          foreach ($symbol in $symbols) {
            Write-Host "=== $symbol ==="
            Get-ChildItem dotnet -Recurse -Filter *.cs | Select-String -Pattern "\b$symbol\b" | ForEach-Object {
              Write-Host ("{0}:{1}: {2}" -f $_.Path.Substring($pwd.Path.Length + 1), $_.LineNumber, $_.Line.Trim())
            }
          }
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
