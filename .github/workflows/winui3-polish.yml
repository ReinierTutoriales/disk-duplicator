name: WinUI3 interface polish audit

on:
  push:
    paths:
      - '.github/winui3_polish.py'
      - '.github/workflows/winui3-polish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Apply WinUI3 inspired polish
        run: python .github/winui3_polish.py
      - name: Format
        run: cargo fmt --all
      - name: Diff check
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests release
        run: cargo test --release
      - name: Build release
        run: cargo build --release
      - name: Commit verified Fluent UI polish and clean helpers
        shell: pwsh
        run: |
          Remove-Item .github/winui3_polish.py
          Remove-Item .github/workflows/winui3-polish.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/part1.rs src/app/part4.rs src/app/part5.rs .github/winui3_polish.py .github/workflows/winui3-polish.yml
          git commit -m "ui: adopt WinUI 3 inspired Fluent styling"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh workflow run build.yml --ref main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ github.token }}
