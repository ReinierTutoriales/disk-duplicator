name: Adaptive slow-branch spool migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-slow-branch-spool.ps1'
      - '.github/workflows/slow-branch-spool-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply adaptive slow-branch spool migration
        shell: pwsh
        run: ./tools/patch-slow-branch-spool.ps1
      - name: Test spool policy and architecture first
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --filter "FullyQualifiedName~FanoutSpoolTests|FullyQualifiedName~UnificationContractTests|FullyQualifiedName~BranchPendingPayloadArchitectureTests"
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit product change and remove migration infrastructure
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/RepartoCopier.Core.csproj dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core/CopyTelemetry.cs dotnet/RepartoCopier.Core/FanoutSpoolStore.cs dotnet/RepartoCopier.Core/FanoutSpillPolicy.cs dotnet/RepartoCopier.Core.Tests/FanoutSpoolTests.cs dotnet/RepartoCopier.Core.Tests/UnificationContractTests.cs
          git rm tools/patch-slow-branch-spool.ps1 .github/workflows/slow-branch-spool-migration.yml
          git commit -m "perf: decouple lagging FAN-OUT branches through adaptive spool"
          git pull --rebase origin main
          git push origin HEAD:main
