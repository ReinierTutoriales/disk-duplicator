          +fn try_deliver_once(tx: &mpsc::Sender<FanoutItem>, item: FanoutItem, control: &DestControl) -> SendOutcome {
          +    match tx.send_timeout(item, SEND_POLL) {
          +        Ok(()) => { control.mark_progress(); SendOutcome::Ok }
