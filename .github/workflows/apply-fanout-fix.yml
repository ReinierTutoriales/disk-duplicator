              s = s.replace('walkdir = "2"\nrfd = "0.15"', 'walkdir = "2"\nrfd = "0.15"\ncrossbeam-channel = "0.5"')
              p.write_text(s)
          PY

      - name: Test and check
        run: cargo test && cargo check

      - name: Commit requested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: send_timeout con umbral de atraso sostenido; destino anidado nuevo"
          git push origin HEAD:feat/fanout-engine
