name: Apply fanout fix

on:
  push:
    branches:
      - feat/fanout-engine

permissions:
  contents: write

jobs:
  apply:
    if: "!startsWith(github.event.head_commit.message, 'fix: send_timeout con umbral de atraso sostenido; destino anidado nuevo')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/fanout-engine
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply requested patch
        shell: bash
        run: |
