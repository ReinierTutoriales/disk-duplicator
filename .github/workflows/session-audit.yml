name: Session and persistence audit

on:
  push:
    branches: [ main ]
    paths:
      - '.github/session_hardening.py'
      - '.github/workflows/session-audit.yml'

permissions:
  contents: write
  actions: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: session-audit
      - name: Apply session hardening
        run: python .github/session_hardening.py
      - name: Format
        run: cargo fmt --all
      - name: Diff check
        run: git diff --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests release
        run: cargo test --locked --release
      - name: Build release
        run: cargo build --locked --release
      - name: Commit verified session hardening and clean helpers
        shell: pwsh
        run: |
          Remove-Item .github/session_hardening.py
          Remove-Item .github/workflows/session-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add resumable copy sessions and safe persistence"
          git push origin main
          gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
