name: Optimize large-block write path

on:
  push:
    branches: [main]
    paths:
      - '.github/optimize-writepath.py'
      - '.github/workflows/optimize-writepath.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-integrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply write-path optimization
        run: python .github/optimize-writepath.py

      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore

      - name: Commit validated optimization and remove staging files
        shell: pwsh
        run: |
          git config user.name "ReinierTutoriales"
          git config user.email "86568548+ReinierTutoriales@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core/CopyTelemetry.cs dotnet/RepartoCopier.Core.Tests/ProductionFastPathTests.cs
          git rm .github/optimize-writepath.py .github/workflows/optimize-writepath.yml
          git commit -m "perf: coalesce large sequential destination writes"
          git push origin HEAD:main
