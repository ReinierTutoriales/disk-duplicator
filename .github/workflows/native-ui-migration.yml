name: Native compact WinUI migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/native_ui_migration.py'
      - '.github/workflows/native-ui-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply native compact UI migration
        shell: pwsh
        run: python tools/native_ui_migration.py
      - name: UI architecture guards
        shell: pwsh
        run: |
          $xaml = Get-Content dotnet/RepartoCopier.WinUI/MainWindow.xaml -Raw
          $code = Get-Content dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs -Raw
          if ($xaml -match 'ProgressList|RunningDestinationTitle') { throw 'Per-destination running UI returned' }
          if ($code -match 'ProgressRow|_progressRows') { throw 'Per-destination progress model returned' }
          if ($xaml -notmatch 'OverallProgressBar') { throw 'Overall progress bar missing' }
          if ($code -notmatch 'SizeInt32\(840, 520\)') { throw 'Compact default size missing' }
          if ($xaml -notmatch 'MaxWidth="820"') { throw 'Compact content width missing' }
          if ($code -notmatch 'ConfigureNativeWindowChrome') { throw 'Native window chrome integration missing' }
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/native-ui
      - name: Commit green product only
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/RepartoCopier.WinUI/MainWindow.xaml dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs dotnet/RepartoCopier.Core.Tests/WinUiCompactProgressContractTests.cs
          git rm .github/workflows/native-ui-migration.yml tools/native_ui_migration.py
          git commit -m 'ui: integrate compact native Windows 11 shell'
          git push origin HEAD:main
