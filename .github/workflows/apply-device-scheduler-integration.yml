name: Apply device scheduler integration

on:
  push:
    paths:
      - '.github/workflows/apply-device-scheduler-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Patch CopyEngine
        shell: pwsh
        run: |
          $encoded = ''
          [System.IO.File]::WriteAllBytes('patch.py', [Convert]::FromBase64String($encoded))
          python patch.py
          Remove-Item patch.py
          Remove-Item '.github/workflows/apply-device-scheduler-integration.yml'
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add 'dotnet/RepartoCopier.Core/CopyEngine.cs' '.github/workflows/apply-device-scheduler-integration.yml'
          git commit -m 'feat: coordinate writes by physical storage device'
          git push origin HEAD:main
