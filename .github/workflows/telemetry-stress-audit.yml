name: Telemetry stress audit

on:
  push:
    branches: [main]
    paths:
      - '.github/apply_telemetry_stress.py'
      - '.github/fix_telemetry_helper.py'
      - '.github/workflows/telemetry-stress-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-stress-audit
  cancel-in-progress: true

jobs:
  validate-stress-integrate:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Align telemetry helper with current engine
        run: python .github/fix_telemetry_helper.py
      - name: Apply telemetry instrumentation and stress harness
        run: python .github/apply_telemetry_stress.py
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Run sustained I/O stress matrix
        run: dotnet run --project .github/stress-runtime/RepartoCopier.Stress.csproj -c Release
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Commit validated telemetry
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.Core/CopyTelemetry.cs dotnet/RepartoCopier.Core.Tests/CoreParityTests.cs
          if (git diff --cached --quiet) { throw 'No telemetry changes produced.' }
          git commit -m "perf: instrument copy pipeline bottlenecks"
          git push origin HEAD:main
