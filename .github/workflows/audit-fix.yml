name: Audit fix and verify

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-fix.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Apply exact audit fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'src/preflight/part2.rs'
          $text = Get-Content -Raw -LiteralPath $p
          $old = "fn final_source_hashes(`r`n"
          if (-not $text.Contains($old)) { $old = "fn final_source_hashes(`n" }
          if (-not $text.Contains($old)) { throw 'final_source_hashes wrapper not found' }
          $text = $text.Replace($old, "#[cfg(test)]`nfn final_source_hashes(`n")
          Set-Content -LiteralPath $p -Value $text -NoNewline -Encoding utf8

          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release
          cargo build --locked --release
          git diff --check
      - name: Commit verified fix and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/audit-fix.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: gate test-only final hash wrapper'
          git push origin HEAD:main
