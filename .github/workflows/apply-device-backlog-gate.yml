name: Apply physical backlog gate

on:
  push:
    paths:
      - '.github/workflows/apply-device-backlog-gate.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Patch CopyEngine
        shell: pwsh
        run: |
          $encoded = ''
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes('patch.py', $bytes)
          python patch.py
          Remove-Item patch.py
          Remove-Item '.github/workflows/apply-device-backlog-gate.yml'
          git config user.name 'ReinierTutoriales'
          git config user.email '86568548+ReinierTutoriales@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core/CopyEngine.cs '.github/workflows/apply-device-backlog-gate.yml'
          git commit -m 'feat: gate fanout backlog by physical device'
          git push origin HEAD:main
