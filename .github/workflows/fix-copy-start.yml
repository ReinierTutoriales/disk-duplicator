name: Copy start fix validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-copy-start.yml'
      - '.github/fix-copy-start.ps1'

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply copy start fix
        shell: pwsh
        run: ./.github/fix-copy-start.ps1

      - name: Restore Core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj

      - name: Test Core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore

      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64

      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore

      - name: Commit validated fix and clean temporary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-copy-start.yml .github/fix-copy-start.ps1
          git add dotnet/RepartoCopier.Core/CopyEngine.cs dotnet/RepartoCopier.WinUI/MainWindow.xaml.cs dotnet/RepartoCopier.WinUI/MainWindow.xaml
          git commit -m 'fix: make copy startup responsive and immediate by default'
          git push origin HEAD:main
