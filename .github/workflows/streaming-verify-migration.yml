name: Streaming verification migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/streaming_verify_migration.py'
      - '.github/workflows/streaming-verify-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply streaming verification migration
        run: python tools/streaming_verify_migration.py
      - name: Architecture guards
        shell: pwsh
        run: |
          $engine = Get-Content dotnet/RepartoCopier.Core/CopyEngine.cs -Raw
          $forbidden = @('VerificationPlan','VerificationBlock','VerificationPlans','VerificationCrc32C')
          foreach ($token in $forbidden) {
            if ($engine.Contains($token)) { throw "Legacy verification state remains: $token" }
          }
          if (-not $engine.Contains('VerificationWorkspaceBytes = 8 * 1024 * 1024')) { throw 'Fixed verification workspace missing' }
          if (-not $engine.Contains('Task.WhenAll(reads)')) { throw 'Coordinated verification reads missing' }
          if (-not $engine.Contains('destinationCrc != sourceCrc')) { throw 'Immediate source/destination CRC comparison missing' }
          if (-not $engine.Contains('CompletedFiles')) { throw 'Committed-file tracking missing' }
      - name: Restore core tests
        run: dotnet restore dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj
      - name: Test core Release
        run: dotnet test dotnet/RepartoCopier.Core.Tests/RepartoCopier.Core.Tests.csproj -c Release --no-restore
      - name: Restore WinUI x64
        run: dotnet restore dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -r win-x64
      - name: Build WinUI Release x64
        run: dotnet build dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained x64
        run: dotnet publish dotnet/RepartoCopier.WinUI/RepartoCopier.WinUI.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifact/RepartoCopier
      - name: Commit green product only
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          git rm -f tools/streaming_verify_migration.py .github/workflows/streaming-verify-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core dotnet/RepartoCopier.Core.Tests
          git commit -m 'perf: replace stored verification plans with streaming compare'
          git push origin HEAD:main
