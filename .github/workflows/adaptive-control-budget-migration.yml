name: Adaptive control budget migration

on:
  push:
    branches: [ main ]
    paths:
      - tools/patch-adaptive-control-budget.ps1
      - .github/workflows/adaptive-control-budget-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Apply migration
        shell: pwsh
        run: ./tools/patch-adaptive-control-budget.ps1
      - name: Commit migration
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Migration produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/RepartoCopier.Core/CopyEngine.cs
          git commit -m 'feat: wire adaptive control-plane memory budget'
          git push origin main
