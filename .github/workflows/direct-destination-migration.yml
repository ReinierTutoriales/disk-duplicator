name: Direct destination migration

on:
  push:
    paths:
      - '.github/workflows/direct-destination-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Normalize one-shot telemetry migration
        shell: pwsh
        run: |
          $path = 'tools/patch-direct-destination-telemetry.ps1'
          $text = [IO.File]::ReadAllText($path)
          $duplicate = @"
          Replace-Exact `$copy @'
                                      SwitchToBuffered(current);
          '@ @'
                                      SwitchToBuffered(current, job);
          '@ 'fallback por error compatible'
          "@
          $text = $text.Replace($duplicate, '')
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
      - name: Close Direct I/O destination telemetry and fallback state
        shell: pwsh
        run: ./tools/patch-direct-destination-telemetry.ps1
