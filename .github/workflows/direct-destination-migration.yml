name: Direct destination migration

on:
  push:
    paths:
      - '.github/workflows/direct-destination-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Close Direct I/O destination telemetry and fallback state
        shell: pwsh
        run: ./tools/patch-direct-destination-telemetry.ps1
